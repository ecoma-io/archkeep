# This IS a workspace: `packages/` will hold the Nx plugin and, later, the editor
# extension that consumes it. The directory is empty at this commit and the glob
# below is what makes the first package resolvable the moment it lands — pnpm
# matches nothing today rather than needing an edit tomorrow.
#
# An empty `packages/` is also why `scripts/check-packages.mjs` exists: with no
# project in the graph, `nx run-many` exits 0 having run nothing, and so does a
# run where a package was added without a manifest or without the targets CI
# names. That script is what tells those three states apart. See AGENTS.md.
packages:
  - "packages/*"

# Every dependency install script is blocked until it is decided on here, and
# pnpm fails the install while any decision is missing — so an unreviewed
# postinstall cannot run in CI just because it shipped in a new release.
#
# lefthook: false — its postinstall only runs `lefthook install`, which this
# package's `prepare` script already does, and which lefthook itself skips
# whenever `CI` is set. The binary comes from optionalDependencies and needs no
# build step, so nothing is lost by never running it.
# nx: false — its postinstall compiles the optional native watcher and warms the
# daemon. CI runs with the daemon off (a single-shot runner has nothing to reuse
# it for) and no target here watches files, so the build buys nothing.
# @vscode/vsce-sign: false — its postinstall copies a prebuilt signing binary out
# of a platform optionalDependency, falling back to an HTTPS download when that
# resolution fails; a network fetch at install time is exactly what this block
# exists to stop. Nothing here signs or verifies a vsix — `vsce package` never
# invokes the binary — and if publishing ever needs it, vsce fails loudly asking
# for it, which is the moment to revisit this decision.
# keytar: false — a node-gyp native build used only by `vsce login` to store
# credentials in the OS keychain. The release lane passes the token via
# environment instead, and nothing interactive runs in CI, so the build is dead
# weight on every install.
allowBuilds:
  lefthook: false
  nx: false
  "@vscode/vsce-sign": false
  keytar: false

# brace-expansion < 5.0.9 is vulnerable to GHSA-rgw5-rvv9-x895 (DoS via
# unbounded intermediate arrays). nx@23.1.1 pulls brace-expansion@5.0.8 through
# minimatch@10.2.5; nx is already at its latest release and cannot be bumped to
# pick up the fix transitively, so this override pins all 5.x instances to the
# patched floor. Convergence syntax ("brace-expansion@") would only help
# consumers that were already compatible; the ranged selector below is explicit
# about the affected band.
overrides:
  "brace-expansion@>=5.0.0 <5.0.9": "5.0.9"
