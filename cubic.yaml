# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
#
# cubic is configured to review every pull request here, but is currently not
# running: the free tier's review budget was exhausted before this repository
# existed, and `gh pr checks` shows `skipping` (conclusion=neutral, title "AI
# review line limit reached") on every PR. No review has ever been posted. The
# configuration stays because it is correct for the day the limit lifts.
#
# When it does run, its scope is defined by what the deterministic gates cannot see:
#
#   1. Prettier, ESLint, `node --test`, `semgrep`, and `check-packages` own
#      everything mechanically decidable. They are the source of truth.
#   2. cubic owns what none of them reach: defects where a gate script or plugin
#      REPORTS NOTHING rather than reporting an error — the silent failure
#      direction that is indistinguishable from a clean workspace.
#   3. For the `arch-*` skills and their host docs, the same silent direction is
#      a STALE CLAIM: a command, flag, exit code, or host directory the text
#      still teaches after the mechanism moved. `check-skills.mjs` pins the
#      regressions it already knows as regexes; cubic owns the claims no regex
#      anticipated — which is why markdown is reviewable here (only
#      CHANGELOG.md, a generated file, is ignored) while the instructions below
#      forbid reviewing its prose.
#
# The reasoning lives in this file rather than in CONTRIBUTING.md because a
# config file is read by whoever is editing it, and nothing else loads with it.

version: 1

reviews:
  enabled: true

  incremental_commits: true
  check_drafts: false

  # `medium` because the value cubic adds is a defect no gate can find, and
  # `low` risks trading exactly that away.
  sensitivity: medium

  resolve_threads_when_addressed: true
  auto_approve: disabled
  architecture_diagrams: false

  custom_instructions: |
    You are the correctness reviewer on an Nx plugin for polyglot workspaces.
    Its central invariant: an empty diagnostic list means "no violation", and
    nothing else. The dangerous direction in every change is the false negative
    — a violation that exists but produces no output. A wrong error is loud; a
    missed one is invisible.

    Report defects in the changed code: wrong logic, unhandled null/undefined,
    swallowed or misclassified errors, await and promise mistakes, race
    conditions, off-by-one and boundary errors, incorrect use of a library or
    platform API, and untrusted input reaching a dangerous sink unvalidated.

    Pay special attention to: child_process calls built from values the package
    tree supplies (paths, manifest fields, project names), gate scripts that can
    return early without printing a failure, and any code path that lets `nx
    run-many` exit 0 having silently skipped a package that exists.

    For any new graph reader or rule: name whether the change can produce an
    empty result when a violation exists, and point to the test that would catch
    it. A test that only pins the loud direction is not a test of the invariant.

    Do NOT report formatting or style: Prettier and ESLint decide those.

    In Markdown files, review claims, never prose. The skills under skills/
    and the docs under docs/ are behavioral protocol and stated mechanism: a
    claim that no longer matches the code — a command, flag, exit code, JSON
    envelope key, config surface, install path, or host directory that moved —
    misdirects its reader exactly the way a silent gate does, because the stale
    sentence reads as current. Flag those. Never comment on wording, tone,
    structure, or link resolution: Prettier owns form and
    scripts/check-docs-links.mjs owns references.

  ignore:
    files:
      - CHANGELOG.md
      - pnpm-lock.yaml
      - "**/dist/**"
      - "**/coverage/**"
      - cubic.yaml

  custom_rules:
    - name: A gate that returns early must do so loudly
      description: >
        Flag any path in scripts/ or packages/ where a gate script exits or
        returns without printing a failure message when it encountered something
        wrong. The two failures that are easy to miss: an early-exit on a
        condition that should have been reported, and a loop that accumulates
        failures into an array but exits 0 if the accumulation is never checked.
        Both look like success to CI.
      include:
        - scripts/**
        - packages/**

    - name: Child process calls must not interpolate package-tree values
      description: >
        Flag any `exec`, `execSync`, `spawn`, or `spawnSync` where the command
        string or any of the argument strings is built from a value that came
        from the filesystem — a directory name, a manifest field, a project name
        from `nx show projects`. Those values are attacker-supplied the moment a
        pull request adds a directory. The fix is always the same: pass the
        command and an argument array, never a built string.
      include:
        - scripts/**
        - packages/**

    - name: A skill teaches only the CLI that ships beside it
      description: >
        Every mechanism claim in skills/*/SKILL.md — a command name, a flag, an
        exit code, a JSON envelope key, a config surface — must match
        packages/lattice in the same tree. Flag both directions: a change to
        the CLI's command surface (commands, flags, exit codes, envelope keys,
        the config surfaces a provider reads) that does not touch the skill
        teaching it, and a skill edit whose claim the code does not implement.
        scripts/check-skills.mjs pins the stale claims it already knows as
        regexes; this rule owns the ones no regex anticipated.
      include:
        - skills/**
        - packages/lattice/**

    - name: Canonical skills are host- and provider-independent
      description: >
        The arch-* skills must work unchanged on every Agent Skills host
        (Claude Code, Codex, Cursor, Copilot, Windsurf, opencode) and describe
        every project-model provider the engine ships (Nx, native
        lattice.json, Moon). Flag frontmatter beyond
        name/description/compatibility (metadata and allowed-tools are
        spec-legal but refused here by decision — docs/skills/authoring.md),
        any skill body that assumes a single agent host (a slash-command
        spelling, an install path like .claude/ or .agents/, a host-specific
        permission or tool name — invocation and installation belong to
        docs/skills/), and any workspace-facing instruction that names one
        provider's config surface as if it were the only one.
      include:
        - skills/**

    - name: A host-matrix row is a claim about someone else's software
      description: >
        docs/skills/supported-hosts.md and docs/skills/installation.md state
        facts about third-party hosts and the `npx skills` CLI — discovery
        directories, invocation syntax, flags. Flag any added or changed row,
        directory, or flag that is not verified against the named tool's
        current documentation, and any command line a tool does not actually
        ship. No gate in this repository can execute another vendor's host, so
        this is the one place "Verify before you write" (AGENTS.md) has no
        deterministic backstop.
      include:
        - docs/skills/**

    - name: pull_request_target never executes head code
      description: >
        In any workflow triggered by `pull_request_target`, flag a `ref:` naming
        the pull request head, a `run:` step consuming head-controlled input, an
        install or build step after head files are restored, and any action
        referenced by tag or branch rather than a full commit SHA.
      include:
        - .github/workflows/**

pr_descriptions:
  generate: false

issues:
  fix_with_cubic_buttons: false
  pr_comment_fixes: false
  fix_commits_to_pr: false
