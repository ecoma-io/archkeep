name: CI

on:
  # Deliberately NOT filtered to `branches: [main]`. A filter there skips CI
  # entirely on a stacked pull request — one targeting another feature branch —
  # so the branch merges having never been checked, and the failure only appears
  # later against someone else's change.
  pull_request:
  # The merge queue re-runs these checks against `main + every pull request
  # ahead in the queue + this one`, which is the only place a semantic conflict
  # between two independently-green pull requests can surface. GitHub reports
  # the result against the required check name below, so `ci-gate` must exist on
  # this event or the queue waits forever.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A merge-queue run must never be cancelled: the queue is blocked on exactly
  # this run, and cancelling it ejects the batch. `github.ref` is already unique
  # per queued batch, and `cancel-in-progress` is true only for pull requests.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-core:
    name: Verify (core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Moon's VCS layer needs the base branch ref for affected detection.
          # A shallow clone lacks it, and Moon fails with "fatal: ambiguous
          # argument 'main'" before --force can skip the check. Full history
          # is Moon's own recommended CI setup.
          fetch-depth: 0

      # Reads the pnpm version from `packageManager` in package.json, so the
      # runner uses the same pnpm a contributor's Corepack fetches.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every pull request lands as a squash, and the squash commit's subject is
      # the pull request title — so the title is the one commit message that
      # never reaches the `commit-msg` hook: no commit carrying that text exists
      # until GitHub writes it at merge time. Same commitlint configuration as
      # the hook, so a valid message has one definition rather than two.
      #
      # The title arrives through the environment, never through `${{ }}`
      # interpolation into the script: interpolation pastes it into the shell
      # source, where a title containing `$(...)` or a backtick would run.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      # Skipped in the merge queue, and it is the only check that is. Prettier's
      # verdict is a pure function of each file's own bytes: merging other pull
      # requests into this one cannot unformat a file that was formatted, so
      # re-running it would re-prove what the pull-request run already proved.
      # Everything below can change under a merge, which is the entire reason
      # the queue exists.
      - name: Check formatting
        if: github.event_name != 'merge_group'
        run: pnpm format:check

      - run: pnpm lint

      # The tests for the gate below. They run first because a broken gate
      # reports nothing rather than reporting a failure, and this is the step
      # that would say so.
      - run: pnpm test

      # The gate scripts' JSDoc, type-checked. `scripts/` is not a Moon project,
      # so the `moon run` step below never reaches it — each package's own
      # `typecheck` target covers only that package.
      - run: pnpm typecheck

      # Reads the target list out of THIS FILE — out of the `moon run` line
      # below — and asserts every directory under `packages/` is a project the
      # graph can see which declares at least one of those targets. Without it
      # the next step exits 0 on three different states, only one of which is
      # good: nothing exists, something exists with no matching target (skipped
      # in silence), or something exists with no manifest (invisible entirely).
      # Runs BEFORE that step, so an unreachable package fails as an error
      # rather than passing as an absence.
      - run: pnpm check-packages

      # Validates the arch-* skill structure: every expected skill exists,
      # frontmatter is well-formed, versions match the package, and no
      # host-specific fields have leaked into the canonical skills.
      - run: node scripts/check-skills.mjs

      # --force skips Moon's VCS affected detection (which needs full git
      # history, unavailable in the shallow checkout) and bypasses the local
      # cache — both correct for CI, where every target must run fresh.
      - name: Run every project's targets
        run: pnpm exec moon run --force ...:lint ...:test ...:typecheck

      # The tool, run on the tree that ships it. Everything above proves the
      # code is correct against fixtures it built itself; this is the only step
      # where the boundary law in `module-boundaries.config.mjs` is enforced
      # against real source, over a tag vocabulary the tool has no knowledge of.
      # A consumer's first question is whether this works outside the workspace
      # it was written in, and a repository that shipped an enforcer it did not
      # run on itself would be answering that question with a promise.
      #
      # It runs LAST on purpose: it spawns `moon project-graph`, so a provider
      # that breaks graph computation fails the step above with a clearer
      # message than this one could give. Exit 3 — could not look — is distinct
      # from exit 1, so a broken run never reads as a clean tree.
      - name: Check this repository's own module boundaries
        run: node packages/lattice/cli.mjs check

      # The step above proves the Moon provider against real source. This repository
      # cannot ALSO carry a root `lattice.json` to prove the native one the same
      # way: `cli.mjs` refuses a root holding both markers (this repository needs
      # `.moon/` — it declares projects and targets, and `moon run` above is half
      # of CI), so a root `lattice.json` would break that step, the Moon project
      # discovery, and `moon run` all at once. The way around it is a throwaway
      # COPY of the tracked tree with `.moon/` and per-project `moon.yml` files
      # removed and a `lattice.json` written in —
      # `.github/native-selfcheck/lattice.json`, tracked and reviewable, describing
      # the same two projects under the same tags this repository's own law already
      # uses.
      #
      # Two properties make this worth a step of its own rather than a curiosity:
      #   - The `diff -q` below proves the copy reads the exact same
      #     `module-boundaries.config.mjs` the step above just ran — the same
      #     bytes, not a second copy that could quietly drift — so a disagreement
      #     between the two steps is a provider defect and nothing else.
      #   - It is the only place the native provider meets this repository's real
      #     source under a tag vocabulary `packages/lattice/src/` has no
      #     knowledge of, the same argument the step above makes for the Moon path.
      #
      # `git archive HEAD` (tracked files only — what `git ls-files` inside the
      # copy will also see) into a fresh git repo, because the native provider's
      # own discovery reads `git ls-files`, not a directory walk: a tree with
      # nothing committed is an empty workspace to it, same as the Nx provider's
      # `git ls-files` call in `src/workspace.mjs`. `packages/lattice/cli.mjs`
      # itself is run from OUTSIDE the copy, with its `cwd` pointed inside it —
      # every relative path `check()` reads (the workspace root, the boundary
      # config, `git ls-files`) resolves from `cwd`, while `import ts from
      # "typescript"` and friends resolve from the running file's own location,
      # so the copy needs none of this repository's `node_modules` and `git
      # archive` never has to carry a gitignored tree that is not in HEAD.
      #
      # Red-direction proof, done twice and both by hand rather than pinned in a
      # fixture — a second copy of this tree's own tests would drift from what
      # this step actually runs, which is the opposite of what red-direction
      # coverage is for:
      #   - Manually verified 2026-08-12: removing the `.claude/**` row from
      #     `.github/native-selfcheck/lattice.json` and re-running this exact
      #     sequence exits 3, naming both `.claude/hooks/*.mjs` files as
      #     unclaimed — the coverage claim below is live, not vacuously
      #     satisfied by an exempt list wide enough to hide a real gap.
      #   - Manually verified 2026-08-12: committing a relative import from
      #     `packages/lattice-vscode` into `packages/lattice` into the copy and
      #     re-running exits 1, naming `noRelativeOrAbsoluteImportsAcrossLibraries`
      #     — the same rule engine the step above runs, reached through the other
      #     provider.
      - name: Check this repository's own module boundaries (native provider)
        run: |
          set -euo pipefail
          law="$PWD/module-boundaries.config.mjs"
          cli="$PWD/packages/lattice/cli.mjs"
          dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$dir"
          rm -r "$dir/.moon"
          rm "$dir/packages/lattice/moon.yml"
          rm "$dir/packages/lattice-vscode/moon.yml"
          cp .github/native-selfcheck/lattice.json "$dir/lattice.json"
          diff -q "$law" "$dir/module-boundaries.config.mjs"
          # Symlinked in, not copied and not installed fresh: the step above
          # (`Check this repository's own module boundaries`) runs against
          # this SAME checkout, `node_modules` and all, so the two steps are
          # meant to differ in exactly one variable — the provider. Without
          # this, `packages/lattice/src/analysis/typescript.mjs`'s resolver
          # (`resolveSpecifier`'s "TypeScript cannot resolve" branch) fails to
          # resolve every bare-package import in the copy for a reason that
          # has nothing to do with the native provider — an absent
          # `node_modules`, not a boundary the provider got wrong — which
          # would report a pile of could-not-resolve failures the Moon-based
          # step never sees and make a real disagreement between the two
          # providers indistinguishable from this one. pnpm gives each
          # workspace package (`packages/*`) its OWN `node_modules`, holding
          # symlinks into the shared store for that package's private
          # dependencies (e.g. `packages/lattice-vscode/node_modules`'s own
          # `vscode-languageclient`) — the root `node_modules` alone does not
          # contain them — so every such directory needs linking, not just
          # the root one.
          ln -s "$PWD/node_modules" "$dir/node_modules"
          for pkg_node_modules in packages/*/node_modules; do
            [ -d "$pkg_node_modules" ] || continue
            ln -s "$PWD/$pkg_node_modules" "$dir/$pkg_node_modules"
          done
          git -C "$dir" init -q
          git -C "$dir" add -A
          git -C "$dir" -c user.name=lattice-native-selfcheck \
            -c user.email=lattice-native-selfcheck@invalid -c commit.gpgsign=false \
            commit -q -m "native self-check tree"
          (cd "$dir" && node "$cli" check)
          rm -rf "$dir"

      # The extension's own artifact, built on every pull request so a change
      # that breaks packaging turns THIS build red instead of the release lane
      # weeks later. It cannot run where the tests above ran: vsce walks
      # `node_modules` with `npm list --production`, which fails outright
      # against pnpm's symlinked layout, so the script stages the tracked files
      # into a throwaway directory, installs the runtime dependencies with npm,
      # and packs there — package-vsix.mjs holds the measurement.
      - name: Package the VS Code extension
        run: node scripts/package-vsix.mjs packages/lattice-vscode dist/lattice-vscode.vsix

      # And prove the vsix holds what an install needs — the entry point, the
      # decision modules, and `node_modules/vscode-languageclient`, the runtime
      # dependency the extension imports on activation. `vsce package` exiting 0
      # proves none of that: a vsix missing the language client installs
      # cleanly and dies in the extension host, which no gate in this file
      # would otherwise see. The release lane runs the same check against the
      # exact bytes it uploads.
      - name: Prove the vsix holds what an install needs
        run: node scripts/verify-vsix.mjs dist/lattice-vscode.vsix

      # Everything above runs the tool where its dependencies already exist, so
      # none of it can see the failure this step is for: the manifest declared
      # zero dependencies once, and the suite stayed green because `typescript`
      # and `smol-toml` sit in the root manifest, pnpm hoists them, and Node
      # walks up. Published as-is it would have installed cleanly and thrown at
      # the first `import ts from "typescript"`.
      #
      # So this packs the real tarball, installs it into a throwaway workspace
      # with a tag vocabulary nothing in `src/` knows about, and drives what a
      # consumer buys — the plugin loading inside a real `nx graph` (Nx is a
      # peer dependency; the artifact must still work inside Nx workspaces),
      # exiting 0 on a clean tree AND 1 on a violating one, and the language
      # server answering through the symlinked path an installed plugin is
      # launched by. The release lane runs the same script before `npm publish`;
      # here it fails the change that broke resolution rather than the release
      # weeks later.
      #
      # Last in verify-core because it is the slowest step in this job by a
      # wide margin — it runs a full `pnpm install` against the registry — and
      # everything above narrows the cause before this reports.
      - name: Prove the packed artifact works outside this workspace
        run: node scripts/verify-package.mjs packages/lattice

  verify-e2e:
    name: Verify (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The smoke subset covers the fastest E2E scenarios (native clean check,
      # native violating check, native graph, native self-baseline diff). The
      # full suite adds parity, determinism, Moon, and extended command
      # coverage. verify-core already proves lint, unit tests, typecheck,
      # self-check, and the packed artifact — the E2E suite does not duplicate
      # those. It packs its own artifact from source and installs it fresh,
      # proving the real CLI works as an installed package.
      - name: E2E smoke tests
        run: pnpm e2e:smoke

      - name: E2E full tests
        run: pnpm e2e

  ci-gate:
    name: ci-gate
    # The single check name a branch ruleset requires, on pull requests and in
    # the merge queue alike. It exists so the required-check name is stable
    # while the job list is not: add a job to `needs` and the gate tightens
    # without anyone editing repository settings — and forgetting to add it is
    # the only way to widen what green means, which is visible in this file.
    needs: [verify-core, verify-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `needs` alone would let a skipped or cancelled job pass as green, since
      # only `failure` blocks a dependent job by default.
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
