name: CI

on:
  # Deliberately NOT filtered to `branches: [main]`. A filter there skips CI
  # entirely on a stacked pull request — one targeting another feature branch —
  # so the branch merges having never been checked, and the failure only appears
  # later against someone else's change.
  pull_request:
  # The merge queue re-runs these checks against `main + every pull request
  # ahead in the queue + this one`, which is the only place a semantic conflict
  # between two independently-green pull requests can surface. GitHub reports
  # the result against the required check name below, so `ci-gate` must exist on
  # this event or the queue waits forever.
  merge_group:
  push:
    # `main` is the one development line, and the one whose pushes are
    # releases: its merged tree runs the full suite on every push, so a red
    # push names its commit instead of surfacing in a release lane later.
    branches: [main]
  workflow_dispatch:

concurrency:
  # A merge-queue run must never be cancelled: the queue is blocked on exactly
  # this run, and cancelling it ejects the batch. `github.ref` is already unique
  # per queued batch, and `cancel-in-progress` is true only for pull requests.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-core:
    name: Verify (core) Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Two floors, both real, both verified: the PUBLISHED packages
      # (`packages/*/package.json`) each declare `engines.node` `>= 22`, and
      # 22 is the leg that holds them to it; 24 is the workspace's own
      # development floor — the root `package.json` declares it, and
      # `.node-version` pins it as the default every other job reads. Both
      # legs run the IDENTICAL suite — the 22 leg is not a reduced subset
      # that could pass over what the 24 leg would run — so a Node-24-only
      # API entering shipped code or a test fails the 22 leg here rather
      # than in a consumer's CI later. If the published floor ever moves,
      # `packages/*/package.json` is the contract to change first and this
      # matrix follows it — never the reverse.
      matrix:
        node: [24, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Moon's VCS layer needs the base branch ref for affected detection.
          # A shallow clone lacks it, and Moon fails with "fatal: ambiguous
          # argument 'main'" before --force can skip the check. Full history
          # is Moon's own recommended CI setup.
          fetch-depth: 0

      # Reads the pnpm version from `packageManager` in package.json, so the
      # runner uses the same pnpm a contributor's Corepack fetches.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every pull request lands as a squash, and the squash commit's subject is
      # the pull request title — so the title is the one commit message that
      # never reaches the `commit-msg` hook: no commit carrying that text exists
      # until GitHub writes it at merge time. Same commitlint configuration as
      # the hook, so a valid message has one definition rather than two.
      #
      # The title arrives through the environment, never through `${{ }}`
      # interpolation into the script: interpolation pastes it into the shell
      # source, where a title containing `$(...)` or a backtick would run.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      # Skipped in the merge queue, and it is the only check that is. Prettier's
      # verdict is a pure function of each file's own bytes: merging other pull
      # requests into this one cannot unformat a file that was formatted, so
      # re-running it would re-prove what the pull-request run already proved.
      # Everything below can change under a merge, which is the entire reason
      # the queue exists.
      - name: Check formatting
        if: github.event_name != 'merge_group'
        run: pnpm format:check

      # The old root lint / test / typecheck steps are gone, and their
      # coverage moved INTO the Moon step below rather than beside it. Each
      # verified a code path a project target now verifies through the same
      # graph that decides what runs:
      #   - `pnpm lint` was `eslint .` from the root — a whole-repository
      #     traversal that re-linted every file each package's own `lint`
      #     target lints, plus `scripts/` and the root configs. The traversal
      #     is gone; `scripts/` and those root files are linted by the
      #     `gate-scripts` project's `lint` target (`scripts/moon.yml`), and
      #     every package file by the package that owns it — each file exactly
      #     once, each under the graph's affected selection.
      #   - `pnpm test` and `pnpm typecheck` covered only `scripts/`, which
      #     sat outside every project as a verification-free zone. They are
      #     `gate-scripts`' `test` and `typecheck` targets now — same
      #     commands, same empty-glob refusals, inside the graph.
      #
      # Reads the target list out of THIS FILE — out of the Moon step below —
      # and asserts every directory under `packages/` plus `scripts/` is a
      # project the graph can see which declares at least one of those
      # targets. Without it the Moon step exits 0 on three different states,
      # only one of which is good: nothing exists, something exists with no
      # matching target (skipped in silence), or something exists with no
      # manifest (invisible entirely). Runs BEFORE that step, so an
      # unreachable project fails as an error rather than passing as an
      # absence.
      - run: pnpm check-packages

      # Validates the arch-* skill structure: every expected skill exists,
      # frontmatter is well-formed, versions match the package, and no
      # host-specific fields have leaked into the canonical skills.
      - run: node scripts/check-skills.mjs

      # Fails on any doc reference that cannot resolve: markdown links in
      # docs/ whose target file is gone, #anchors that name no heading, and
      # docs/… citations in code comments and strings pointing at a file that
      # does not exist. The documentation IA restructure once deleted two
      # files and left twenty-five references — two inside shipped error
      # messages — pointing at the old paths, and nothing caught it until
      # someone clicked one. Prettier formats markdown but does not resolve a
      # link; this step is where "does the link land" is answered.
      - run: node scripts/check-docs-links.mjs

      # Three doc-parity gates, each holding a document that restates a fact
      # owned elsewhere to that source: the CLI roster/count claims to
      # COMMAND_NAMES (exported by packages/archkeep/cli.mjs), installation.md's
      # prerequisites to packages/archkeep/package.json, and CONTRIBUTING's
      # command roster and hook documentation to THIS FILE and lefthook.yml.
      # Their judgment functions are unit-tested under `pnpm test`; running the
      # executables here is what pins the real tree, the same reason
      # check-skills and check-docs-links above are steps and not only tests.
      - run: node scripts/check-cli-docs-roster.mjs
      - run: node scripts/check-installation-prereqs.mjs
      - run: node scripts/check-contributing-parity.mjs
      - run: node scripts/check-docs-claims-parity.mjs

      # The four committed .wasm artifacts, checked for their own build machine.
      # Gitleaks (analysis.yml) scans text and does not read wasm, and no diff
      # shows a reviewer what 6MB of bytes contains — so without this step a
      # secret inside a shipped binary reaches npm, PyPI and crates.io with
      # every gate green. Both spellings of that are already in this
      # repository's history; the script's header names them.
      - run: node scripts/check-artifact-hygiene.mjs

      # The Rust rule SDK's `lint` target runs `cargo clippy`, and the hosted
      # runner's Rust toolchain ships without that component — measured against
      # the ubuntu-24.04 runner image's own software list, which names Cargo,
      # Rust, Rustdoc and Rustup (and, under packages, a standalone Rustfmt)
      # and no clippy. rustup is present, so the components are added rather
      # than a toolchain action pinned; rustfmt is named too because the
      # toolchain rustup manages resolves its own components, not the
      # standalone binary the image lists beside it.
      #
      # The wasm32 target is added for the same reason and buys something no
      # component does: that SDK's `typecheck` target type-checks the crate a
      # second time for `wasm32-unknown-unknown`, which is the only pass that
      # reads the `#[cfg(target_arch = "wasm32")]` ABI exports every artifact
      # runs on (`../../packages/archkeep-rule-sdk-rust/moon.yml` measures what
      # the host pass misses). It installs a std for the target and compiles
      # nothing extra of this repository's — the rebuild that
      # `packages/archkeep-rule-sdk-rust/rebuild-example.sh` argues CI should
      # not do stays out.
      - name: Add the Rust components and target the SDK's targets run
        run: |
          rustup component add clippy rustfmt
          rustup target add wasm32-unknown-unknown

      # The Python SDK's `lint` target runs Ruff, and the version is pinned
      # here rather than taken from the runner image's preinstalled copy so a
      # new Ruff release cannot rewrite the verdicts on its own schedule.
      # `packages/archkeep-rule-sdk-python/ruff.toml` argues the rule roster.
      - name: Install the pinned Ruff the Python SDK's lint target runs
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.15.16"

      # The Go SDK's targets run on a pinned toolchain instead of whichever
      # Go the runner image ships this month — the same determinism the
      # Node matrix buys, and `go-version-file` keeps the floor owned by the
      # module that requires it.
      - name: Pin the Go toolchain the Go SDK's targets run
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/archkeep-rule-sdk-go/go.mod

      # golangci-lint is downloaded and checksum-pinned rather than taken from
      # the runner image (whose copy moves underneath every job) and rather
      # than an installer action (a second moving piece when the release
      # tarball's digest is already the pin). The digest was read off the
      # v2.12.2 release artifact itself. The `lint` target in
      # `packages/archkeep-rule-sdk-go/moon.yml` argues the linter roster and
      # why `go vet` is not run beside it.
      - name: Install the pinned golangci-lint the Go SDK's lint target runs
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/golangci-lint"
          mkdir -p "$dir"
          curl --silent --show-error --fail --location \
            --output "$dir/golangci-lint.tar.gz" \
            "https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz"
          echo "8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553  $dir/golangci-lint.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/golangci-lint.tar.gz" -C "$dir"
          # /usr/local/bin, not $GITHUB_PATH: Moon composes a task's PATH
          # from its toolchain dirs and drops the runner's per-step PATH
          # additions (measured: the first run failed with "golangci-lint:
          # command not found" inside the task this install had put on the
          # step's PATH). A system location is on every PATH a task can
          # build.
          sudo mv "$dir/golangci-lint-2.12.2-linux-amd64/golangci-lint" /usr/local/bin/golangci-lint

      # The old line here was `moon run --force`, argued as "skips Moon's VCS
      # affected detection (which needs full git history, unavailable in the
      # shallow checkout)" — while this job's own checkout above has carried
      # `fetch-depth: 0` all along. The premise was stale: full history was
      # present, so the only thing `--force` still did was disable affected
      # detection and the input-hash cache, and every project's every target
      # ran on every pull request no matter what changed.
      #
      # The replacement is Moon's own CI mode selecting exactly the targets a
      # change can have moved — through each task's declared `inputs` (the
      # per-project `moon.yml` files) and the projects' `dependsOn` graph:
      #
      #   - pull_request: `moon ci` against the pull request's base commit.
      #     The base SHA is taken from the event payload rather than
      #     `origin/$BASE_REF` because it is an ancestor of the checked-out
      #     merge ref by construction — no dependency on which remote a fork
      #     pull request fetches.
      #   - merge_group: the same against `origin/<queue target>`, taken
      #     from the event's `base_ref` (`refs/heads/main` today) rather
      #     than hardcoded, so a merge queue on another base branch needs
      #     no edit here. The queue branch holds the target branch
      #     plus every pull request ahead in the batch, so that diff IS
      #     the batch, and `GITHUB_BASE_REF` is empty on this event.
      #   - push to main, workflow_dispatch: `moon run` with no affected
      #     filter — on the branch that ships, everything runs. An affected
      #     filter there would diff `main` against itself and run nothing;
      #     MOON_BASE stays empty and the `else` leg takes over.
      #
      # A pull request that touches nothing the graph maps to a target — a
      # documentation-only change, say — exits 0 with Moon's own "No tasks
      # affected by changed files" line in the log: the empty result is the
      # graph's claim, printed rather than implied, and the repository-wide
      # gates around this step still ran.
      #
      # `moon ci` is affected by definition — it has no `--affected` flag,
      # and passing one is a clap error. (`moon run --affected` exists, and
      # there its optional value swallows the token after it; `moon ci`
      # avoids both traps.)
      - name: Run the targets the change can have moved
        env:
          # The pull request's base commit, from the event payload rather
          # than `origin/$BASE_REF`: it is an ancestor of the checked-out
          # merge ref by construction, so no fork's remote layout matters.
          # The merge queue's branch holds the target branch plus every
          # pull request ahead in the batch, so diffing against that target
          # there is exactly the batch — which is why `base_ref` is read
          # from the event instead of naming a branch.
          MOON_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_ref || '' }}
        run: |
          if [ -n "$MOON_BASE" ]; then
            # The merge-queue event names its base as a fully-qualified ref
            # (`refs/heads/main`); moon wants the remote-tracking spelling,
            # so a value in that shape gets the prefix swapped. The pull
            # request event's value is a plain SHA, which must pass through
            # untouched — rewriting one produced `origin/<sha>`, a ref that
            # exists nowhere, and took this step down.
            case "$MOON_BASE" in
              refs/heads/*) MOON_BASE="origin/${MOON_BASE#refs/heads/}" ;;
            esac
            pnpm exec moon ci --base="$MOON_BASE" ...:lint ...:test ...:typecheck
          else
            pnpm exec moon run ...:lint ...:test ...:typecheck
          fi

      # The tool, run on the tree that ships it. Everything above proves the
      # code is correct against fixtures it built itself; this is the only step
      # where the boundary law in `module-boundaries.config.mjs` is enforced
      # against real source, over a tag vocabulary the tool has no knowledge of.
      # A consumer's first question is whether this works outside the workspace
      # it was written in, and a repository that shipped an enforcer it did not
      # run on itself would be answering that question with a promise.
      #
      # It runs LAST on purpose: it spawns `moon project-graph`, so a provider
      # that breaks graph computation fails the step above with a clearer
      # message than this one could give. Exit 3 — could not look — is distinct
      # from exit 1, so a broken run never reads as a clean tree.
      - name: Check this repository's own module boundaries
        run: node packages/archkeep/cli.mjs check

      # The step above proves the Moon provider against real source. This repository
      # cannot ALSO carry a root `archkeep.json` to prove the native one the same
      # way: `cli.mjs` refuses a root holding both markers (this repository needs
      # `.moon/` — it declares projects and targets, and `moon run` above is half
      # of CI), so a root `archkeep.json` would break that step, the Moon project
      # discovery, and `moon run` all at once. The way around it is a throwaway
      # COPY of the tracked tree with `.moon/` and per-project `moon.yml` files
      # removed and a `archkeep.json` written in —
      # `.github/native-selfcheck/archkeep.json`, tracked and reviewable,
      # describing the same projects under the same tags this repository's
      # own law already uses — every project the Moon graph declares, one
      # `declared` entry each, and the same knowingly-unclaimed leftovers.
      #
      # Two properties make this worth a step of its own rather than a curiosity:
      #   - The `diff -q` below proves the copy reads the exact same
      #     `module-boundaries.config.mjs` the step above just ran — the same
      #     bytes, not a second copy that could quietly drift — so a disagreement
      #     between the two steps is a provider defect and nothing else.
      #   - It is the only place the native provider meets this repository's real
      #     source under a tag vocabulary `packages/archkeep/src/` has no
      #     knowledge of, the same argument the step above makes for the Moon path.
      #
      # `git archive HEAD` (tracked files only — what `git ls-files` inside the
      # copy will also see) into a fresh git repo, because the native provider's
      # own discovery reads `git ls-files`, not a directory walk: a tree with
      # nothing committed is an empty workspace to it, same as the Nx provider's
      # `git ls-files` call in `src/workspace.mjs`. `packages/archkeep/cli.mjs`
      # itself is run from OUTSIDE the copy, with its `cwd` pointed inside it —
      # every relative path `check()` reads (the workspace root, the boundary
      # config, `git ls-files`) resolves from `cwd`, while `import ts from
      # "typescript"` and friends resolve from the running file's own location,
      # so the copy needs none of this repository's `node_modules` and `git
      # archive` never has to carry a gitignored tree that is not in HEAD.
      #
      # Red-direction proof, done twice and both by hand rather than pinned in a
      # fixture — a second copy of this tree's own tests would drift from what
      # this step actually runs, which is the opposite of what red-direction
      # coverage is for:
      #   - Manually verified 2026-08-12: removing the `.claude/**` row from
      #     `.github/native-selfcheck/archkeep.json` and re-running this exact
      #     sequence exits 3, naming both `.claude/hooks/*.mjs` files as
      #     unclaimed — the coverage claim below is live, not vacuously
      #     satisfied by an exempt list wide enough to hide a real gap.
      #   - Manually verified 2026-08-12: committing a relative import from
      #     `packages/archkeep-vscode` into `packages/archkeep` into the copy and
      #     re-running exits 1, naming `noRelativeOrAbsoluteImportsAcrossLibraries`
      #     — the same rule engine the step above runs, reached through the other
      #     provider.
      #
      # UNIX-ONLY: this step shells out to `ln -s` (below) and `mktemp -d`,
      # and stock Windows needs developer mode for symlinks. Every job in this
      # file runs `ubuntu-latest`, so the constraint is real and named rather
      # than claimed away — there is no Windows leg for the self-check, and
      # this step would fail loudly there, not silently skip.
      - name: Check this repository's own module boundaries (native provider)
        run: |
          set -euo pipefail
          law="$PWD/module-boundaries.config.mjs"
          cli="$PWD/packages/archkeep/cli.mjs"
          dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$dir"
          rm -r "$dir/.moon"
          rm "$dir"/packages/*/moon.yml "$dir"/scripts/moon.yml
          cp .github/native-selfcheck/archkeep.json "$dir/archkeep.json"
          diff -q "$law" "$dir/module-boundaries.config.mjs"
          # Symlinked in, not copied and not installed fresh: the step above
          # (`Check this repository's own module boundaries`) runs against
          # this SAME checkout, `node_modules` and all, so the two steps are
          # meant to differ in exactly one variable — the provider. Without
          # this, `packages/archkeep/src/analysis/typescript.mjs`'s resolver
          # (`resolveSpecifier`'s "TypeScript cannot resolve" branch) fails to
          # resolve every bare-package import in the copy for a reason that
          # has nothing to do with the native provider — an absent
          # `node_modules`, not a boundary the provider got wrong — which
          # would report a pile of could-not-resolve failures the Moon-based
          # step never sees and make a real disagreement between the two
          # providers indistinguishable from this one. pnpm gives each
          # workspace package (`packages/*`) its OWN `node_modules`, holding
          # symlinks into the shared store for that package's private
          # dependencies (e.g. `packages/archkeep-vscode/node_modules`'s own
          # `vscode-languageclient`) — the root `node_modules` alone does not
          # contain them — so every such directory needs linking, not just
          # the root one.
          ln -s "$PWD/node_modules" "$dir/node_modules"
          for pkg_node_modules in packages/*/node_modules; do
            [ -d "$pkg_node_modules" ] || continue
            ln -s "$PWD/$pkg_node_modules" "$dir/$pkg_node_modules"
          done
          git -C "$dir" init -q
          git -C "$dir" add -A
          git -C "$dir" -c user.name=archkeep-native-selfcheck \
            -c user.email=archkeep-native-selfcheck@invalid -c commit.gpgsign=false \
            commit -q -m "native self-check tree"
          (cd "$dir" && node "$cli" check)
          # The verdict was already delivered by the check's exit code above. This
          # line only discards a mktemp tree the GitHub Actions runner deletes
          # anyway when the job completes. A cleanup race inside `.git`
          # (measured in merge-queue run 33032684620, where the check PASSED and
          # then `rm -rf` failed with "Directory not empty") re-running a check that
          # already passed is the failure being refused here.
          rm -rf "$dir" || true

      # The extension's own artifact, built on every pull request where the
      # graph says the extension moved, so a change that breaks packaging
      # turns THIS build red instead of the release lane weeks later. It
      # cannot run where the tests ran: vsce walks `node_modules` with
      # `npm list --production`, which fails outright against pnpm's
      # symlinked layout, so the script stages the tracked files into a
      # throwaway directory, installs the runtime dependencies with npm, and
      # packs there — package-vsix.mjs holds the measurement. On the merge
      # queue and on `main` the packaging is unconditional (MOON_BASE empty).
      - name: Package and prove the VS Code extension artifact
        env:
          MOON_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$MOON_BASE" ]; then
            pnpm exec moon run archkeep-vscode:package --base="$MOON_BASE" --affected
          else
            pnpm exec moon run archkeep-vscode:package
          fi

      # The engine's packed artifact, proven the way a consumer buys it: the
      # tarball installed into throwaway workspaces this repository never
      # built, the plugin loading inside a real `nx graph`, the checker's
      # exit contract, the language server answering `initialize` through
      # the symlinked path an installed plugin launches by. Slowest task in
      # the job (it installs from the registry), so it runs last and gated
      # like the rest.
      - name: Prove the packed engine artifact works outside this workspace
        env:
          MOON_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$MOON_BASE" ]; then
            pnpm exec moon run archkeep:integration --base="$MOON_BASE" --affected
          else
            pnpm exec moon run archkeep:integration
          fi

  verify-e2e:
    name: Verify (E2E ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One suite, two runners. Sharding is by test FILE, and the assignment
      # is vitest's, not this file's: measured against vitest 4.1.10, it
      # hashes each resolved file's workspace-relative path with SHA-1, sorts
      # by that hash, and gives each shard a contiguous slice. Deterministic
      # run to run, and every file lands in exactly one shard — but the sort
      # key is a path, not a cost, so the two legs are not expected to take
      # equal wall time and nothing here should be written as though they do.
      #
      # That same hashing is why the split cannot be tuned by ordering:
      # `shard()` re-sorts by hash whatever order it is handed, so a vitest
      # `sequence` option would change execution order within a shard and not
      # which shard a file belongs to. What does move a file is its NAME
      # (the hash is of the path) or a change in how many e2e files there
      # are (the slice boundaries move with the count) — so rebalancing is
      # not a knob this file has, and an uneven pair is a fact to live with
      # rather than a setting to correct.
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One shard of the E2E suite. It packs its own artifact from source and
      # installs it fresh, proving the real CLI works as an installed package;
      # verify-core already proves lint, unit tests, typecheck, self-check,
      # and the packed artifact, so nothing here duplicates those.
      #
      # Two orthogonal decisions, deliberately not mixed:
      #   - WHETHER the suite runs is Moon's call, and only on a pull
      #     request: the query maps changed files onto the graph, and the
      #     engine project's affected status is the semantic trigger for E2E
      #     (the suite drives the packed engine artifact; the shipped rule
      #     artifacts ride the same inputs). A documentation-only change
      #     skips loudly, with a step-summary line naming the skip as
      #     deliberate. The merge queue and `main` always run the suite: the
      #     queue verifies the actual merge state, which is no place for an
      #     affected shortcut.
      #   - HOW it runs is the shard: same suite, same file-hash split as
      #     before, handed straight to the vitest CLI — no Moon in the
      #     process tree, because Moon exports its own workspace as
      #     `MOON_*` environment into every task it wraps, and the E2E
      #     consumers must resolve the workspaces they create, not this one
      #     (measured: a Moon-wrapped run failed nine rule-integrity checks
      #     on that leak alone).
      #
      # A green shard has to mean "these files ran and passed", so both ways a
      # shard can end up running nothing exit 1 — measured against vitest
      # 4.1.10:
      #   - No test file resolved at all: `No test files found, exiting with
      #     code 1`, because `passWithNoTests` defaults to false.
      #   - Fewer files resolved than there are shards: `--shard <count> must
      #     be a smaller than count of test files`, thrown before any test
      #     runs. This is the one that would bite if the `include` glob or a
      #     mass rename ever left a single e2e file behind.
      - name: E2E tests (shard ${{ matrix.shard }}/2)
        env:
          SHARD: ${{ matrix.shard }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            affected="$(pnpm exec moon query projects --affected | jq '[.projects[].id] | index("archkeep") != null')"
            if [ "$affected" != "true" ]; then
              echo "E2E not affected: the changed files do not move the engine project. Skipping deliberately."
              echo "### E2E skipped — not affected" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          pnpm e2e --shard="$SHARD"/2

  ci-gate:
    name: ci-gate
    # The single check name a branch ruleset requires, on pull requests and in
    # the merge queue alike. It exists so the required-check name is stable
    # while the job list is not: add a job to `needs` and the gate tightens
    # without anyone editing repository settings — and forgetting to add it is
    # the only way to widen what green means, which is visible in this file.
    # Visible, and enforced: scripts/ci-drift-pins.test.mjs reads this file and
    # fails when a job sits outside `needs`, or when `needs` names a job that
    # does not exist.
    needs: [verify-core, verify-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `needs` alone would let a skipped or cancelled job pass as green, since
      # only `failure` blocks a dependent job by default.
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
