name: Review

# Automated pull request review: the agent decides what to read, verifies
# before it claims, and comments its findings on the pull request.
#
# The working tree under `pull_request` is untrusted input. The action
# confines itself to GITHUB_WORKSPACE and writes exactly one marker
# comment. A fork's pull request carries neither secrets nor a write token,
# so it fails loudly rather than silently skipping — the action itself
# handles that contract.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: read-all

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ecoma-io/action-agents/review@9206c30557e450e11016f8600cea9639a6205c1a # v0.4.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          model: review
          dry-run: "false"
