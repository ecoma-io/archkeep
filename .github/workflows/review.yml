name: Review

# Dogfood: the organisation's `review` action (ecoma-io/action-agents) reviews
# this repository's own pull requests — the enrollment recorded in that
# repository's docs/dogfood.md at v0.11.2, in the rollout's dry-run posture:
# the run artifact is the whole output and no comment is written to any pull
# request. The flip to live is one line, taken only after the first-run
# checklist has passed twice.
#
# The ref is digest-pinned to the commit the released tag v0.11.2 names — the
# maintainer decision recorded on #804. The rollout's policy is the released
# exact version, never `@main` and never a floating tag: the operator must
# know which bytes run before any of them do, and adopting a later fix is a
# deliberate re-pin, never an accident of a moving tag (action-agents
# docs/dogfood.md, "Refs and secrets" and "Incident rules"). Digest-pinning
# honors that intent and satisfies this repository's supply-chain rule
# (`workflow-action-not-pinned-to-sha`, .github/semgrep/workflows.yaml):
# a tag is a pointer upstream can repoint, so the immutable commit is what
# the `uses:` resolves, with the tag readable beside it. Renovate's
# action-pinning preset keeps the pair current; a bump is the re-pin.
#
# No policy file: review runs on built-in defaults (strictness medium,
# strategy standard, language en, maxDiffLines 5000, no ignore), and an absent
# file is policy-empty for review, not a misconfiguration. The first question
# is whether the default reviewer's findings are worth reading on this
# repository, unconfounded by local rubric.
#
# `security-events: write` and the SARIF upload are deliberately absent: the
# Code Scanning surface is action-agents' own merge-enforcement story, and a
# target that later wants alerts in its Security tab adds the upload step and
# that grant together, never either alone.

on:
  pull_request:
    # No `edited`: a re-worded description does not change the code under
    # review. No `workflow_dispatch`: without a pull request there is nothing
    # to review.
    types: [opened, synchronize, reopened, ready_for_review]

# The workflow-level floor grants nothing; the review job below restates its
# reads and holds every write — a job-level `permissions` block REPLACES this
# one rather than merging with it, so a job added later inherits read-only
# instead of silently widening.
permissions: read-all

# One review per pull request: a rapid push sequence replaces the queued
# review rather than stacking reviews of stale heads.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The action's own needs: the working tree is the review's subject, and
    # the one write is the marker comment — a surface this workflow holds
    # closed until the dry-run flip. One grant narrower than any workflow that
    # carries the SARIF upload.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Unlike triage, whose reads all go through the API, review's subject IS
      # the working tree — this checkout is the snapshot the action reads. No
      # credential left in the workspace the checkout fills with pull-request
      # content: under `pull_request` that content is untrusted input, and a
      # fork's pull request gets neither secrets nor a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - id: review
        uses: ecoma-io/action-agents/review@97f294f439ee9dd12f60a1a723469f6dcdf9c93f # v0.12.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          model: review
          dry-run: "false"

      # The path is the exact file the run declared via its `artifact-file`
      # output — set on green runs and on the red boundary's record alike, and
      # empty on terminals that declare none, which the `if` covers both ways.
      # The record directory is hidden by design, so `include-hidden-files:
      # true` is load-bearing: upload-artifact prunes hidden files by default.
      # `if-no-files-found: warn` keeps a declared write that lands nowhere
      # loud instead of green over nothing.
      - name: Upload the run artifact
        if: always() && steps.review.outputs.artifact-file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-run-artifact
          path: ${{ steps.review.outputs.artifact-file }}
          include-hidden-files: true
          if-no-files-found: warn
