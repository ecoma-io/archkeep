name: Analysis

# Static analysis, not "security" — the name matters because what runs here is
# wider than vulnerabilities, and a workflow called Security makes the next
# reader either mis-file a correctness finding or leave it out.
#
# Three analysers share one workflow because they answer parts of the same
# question — what this code does (CodeQL), what this code does that we have
# specifically decided it must not (Semgrep), and what secrets leaked into the
# tree (Gitleaks) — and a reader chasing "what analysis is in place?" should
# find all of it in one file.
#
# Nothing is declared above the jobs except read permissions, and each job's
# extra write stays at its own job level — a job-level `permissions` block
# REPLACES the workflow-level one rather than merging with it, so read access
# has to be restated there.

on:
  push:
    branches: [main]
  # Unfiltered, for the same reason `ci.yml` is: `Semgrep` is a required status
  # check, and a `branches: [main]` filter here would skip this workflow entirely
  # on a stacked pull request — leaving that check pending forever rather than
  # failing, which is a block with nothing to fix.
  pull_request:
  # And present on `merge_group` for the same reason `ci-gate` is: the queue
  # waits for every required check to report against the queued ref, so a
  # required check whose workflow does not trigger there never arrives.
  merge_group:
  # One weekly cron covers every job in this workflow, which is a consequence
  # of the merge rather than a coincidence: a workflow's schedule triggers each
  # job in it, so two crons would mean each analysis running twice a week under
  # the other's name.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

# A push to main gets a run of its own per commit; a new push to a pull request
# supersedes the in-flight run for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only this job uploads SARIF, so the write stays here rather than at the
    # top level, where any job added later would silently inherit it.
    # A job-level `permissions` block REPLACES the workflow-level one rather
    # than merging with it, so read access has to be restated: omit it and
    # checkout loses read access to the repository.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      # `actions` needs a leg of its own even though the workflow files are
      # already IN the javascript-typescript database — that invocation extracts
      # them and then interprets `js/*` queries and nothing else. Without this
      # leg every workflow-security query runs zero times: expression injection
      # of `github.event.*` into a `run:` block, untrusted checkout under
      # `pull_request_target`, artifact poisoning, a job with no `permissions:`.
      matrix:
        include:
          # Covers the `.mjs` sources here: the gate scripts today, the Nx
          # plugin once it lands. `javascript-typescript` is one language to
          # CodeQL, and it extracts `.mjs` as JavaScript.
          - language: javascript-typescript
            build-mode: none
          # `none` is the only mode `actions` has: workflow files are read as
          # data, never built.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    # Written as `tag@digest` so the version stays readable while the digest is
    # what actually resolves — the analyser cannot change under a rerun, and
    # Renovate bumps both halves together.
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `.github/semgrep/` holds the rules AND their fixtures — files whose
      # entire job is to be reported — so it is excluded from every scan of the
      # repository and checked by `semgrep --test` instead. This runs first: a
      # rule that has quietly stopped matching passes every scan below by
      # finding nothing.
      - name: Test the rules against their fixtures
        run: semgrep --test --config .github/semgrep .github/semgrep

      # Reporting pass. `p/javascript` is the one registry pack carried, and it
      # is carried for the half of this repository that executes: the gate
      # scripts walk a tree of directories somebody else contributed and shell
      # out over what they find.
      - name: Scan
        run: >-
          semgrep scan --config .github/semgrep --config p/javascript
          --exclude .github/semgrep --sarif --output semgrep.sarif

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # Blocking pass, and deliberately the repository's own rules only: a
      # registry pack can gain a rule overnight and turn main red for a change
      # nobody made, whereas everything under `.github/semgrep/` is reviewed here
      # and pinned by a test. Runs after the upload so findings reach the
      # Security tab even when this step fails the job.
      - name: Enforce the repository's own rules
        run: >-
          semgrep scan --config .github/semgrep --exclude .github/semgrep
          --error --quiet

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Scans the whole history, not just the diff, because a secret removed in
      # a later commit is still a leak while it sits in the tree. The action
      # exits 1 when a secret is found, which is what makes this job the
      # blocking gate: `GITLEAKS_ENABLE_COMMENTS` stays at its default (true)
      # so a PR finding lands a comment next to the line.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Secret named for this organization (ECOMA_GITLEAKS_LICENSE) because
          # it lives under `ecoma-io`; required for scanning a repo that belongs
          # to an organization account. Without it the action exits 1 at
          # validation.
          GITLEAKS_LICENSE: ${{ secrets.ECOMA_GITLEAKS_LICENSE }}
