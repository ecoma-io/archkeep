# The conformance differential against REAL public Nx workspaces, pinned at
# fixed commits — `scripts/differential-real-trees.mjs`, which holds the tree
# table, the explained-differences ledger, and the exit contract.
#
# THIS IS NOT A REQUIRED CHECK, AND THAT ABSENCE IS DELIBERATE — read this
# before wiring it into `ci-gate`. Every required check answers for the diff
# under review; this one also depends on two third-party repositories being
# reachable and on their registries serving ~5000 packages. Gating merges on
# that would block every pull request the hour GitHub or npm hiccups, and the
# pressure to get unblocked is exactly how a differential gets deleted. So it
# runs weekly and on demand instead — but the demotion is in WHERE it runs,
# never in what a result means: `src/conformance/README.md` (condition 3 under
# "What this licenses") points here as the evidence, and a red run of this
# workflow is a conformance regression to be fixed like a failing required
# check, not a flake to re-run. The weekly schedule exists so that a
# renovate-bumped `@nx/eslint-plugin` or eslint is re-measured against the
# pinned trees within days of landing, not on whichever release notices.
#
# A red run is not a treasure hunt either: the run writes the verdict envelope
# (`--summary-out`, below) and the `Reconcile the issue trail` step consumes
# it — `scripts/reconcile-differential-issue.mjs` owns that lifecycle. A
# findings-red opens or updates the `conformance-differential` issue; a later
# green run closes it; an infra-red never touches it, because a run that could
# not look cannot prove a divergence gone. The same envelope feeds the
# release lane: `release.yml`'s `verify-conformance` gate re-runs this script
# against the tagged bytes before publish. Both consumers read the envelope,
# never this workflow's log.
#
# Nothing tree-side is cached (the script's header carries the argument: a
# fresh clone at a pinned sha cannot be stale, and a cached node_modules that
# survived a lockfile change would measure yesterday's inputs under today's
# shas). The `cache: pnpm` below caches only THIS repository's own store, the
# same as ci.yml.
name: Differential

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:17 UTC — an off-peak minute rather than a popular
    # on-the-hour slot GitHub delays or drops under load.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  differential:
    name: Differential against real trees
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Narrowed from the workflow-level block: job-level `permissions` REPLACES
    # it rather than extending it, so `contents: read` is restated for the
    # checkout, and `issues: write` exists for the reconcile step below.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exit 3 (clone/install/graph failed — the run could not look) is as red
      # as exit 1 (an unexplained difference or an empty-verdict breach); the
      # log's last lines say which one it was. The envelope must be written on
      # BOTH paths so the reconcile step can tell the classes apart — which is
      # why the step captures and re-exits the code instead of letting a
      # non-zero exit short-circuit the steps below it.
      - name: Run the differential
        run: |
          set +e
          node scripts/differential-real-trees.mjs --summary-out "$RUNNER_TEMP/differential-summary.json"
          code=$?
          exit "$code"

      # `if: always()`: the issue trail must be reconciled on a RED run too —
      # that is the whole point of its existence. The step decides from the
      # envelope's exitClass; a missing or malformed envelope makes it fail
      # loudly, because a red run whose issue never landed is a silent miss.
      # The scheduled run measures the default branch, which is exactly the
      # ref the issue trail's auto-close may trust (the release lane's tag
      # runs never reconcile — `release.yml` has no such step).
      - name: Reconcile the issue trail
        if: always()
        env:
          DIFFERENTIAL_SUMMARY: "${{ runner.temp }}/differential-summary.json"
          DIFFERENTIAL_REPO: "${{ github.repository }}"
          DIFFERENTIAL_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DIFFERENTIAL_SHA: "${{ github.sha }}"
          GH_TOKEN: "${{ github.token }}"
        run: node scripts/reconcile-differential-issue.mjs

  # The second lane in this workflow, and a different question: not "does this
  # engine agree with ESLint" but "how much of a real repository does each
  # analyzer read". `scripts/coverage-real-trees.mjs` holds the tree table, the
  # measured counts and the exit contract.
  #
  # It rides this workflow rather than a new one because it has the same
  # posture for the same reasons: it depends on third-party repositories being
  # reachable, so it must not gate a pull request, and a red run is a
  # regression to be fixed rather than a flake to re-run. It is a separate JOB
  # rather than a step so a red differential and a red coverage lane are
  # distinguishable at a glance, and so one being down does not hide the other.
  #
  # It shares nothing with the differential job — no cache, no clone — because
  # the clones are pinned by sha and a fresh one cannot be stale.
  coverage:
    name: Analyzer coverage on real trees
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exit 3 (a tree could not be cloned or read — the run could not look) is
      # as red as exit 1 (a pinned count moved); the log's last lines say which.
      - name: Measure the analyzers against real Go, Rust and Python trees
        run: node scripts/coverage-real-trees.mjs
