  publish-ts-sdk:
    name: Publish the TypeScript rule SDK to npm
    # The second package this repository publishes to npm, on the same token as
    # the engine above. It is a SEPARATE job rather than a second step there,
    # for the reason every destination here is its own job: the two packages
    # fail independently, and a step appended to the engine's job would either
    # block the engine on the SDK or bury the SDK's failure behind an engine
    # that already shipped.
    #
    # The gate expression is the npm job's, verbatim — see the comment there;
    # a divergence between the publish jobs is a release that ships to one
    # destination and not another.
    #
    # This job publishes on every release with no token guard, matching the
    # engine's job rather than the crates.io and PyPI jobs below: those guard
    # because their organisation secrets may not be granted to this repository,
    # while `ECOMA_NPM_ACCESS_TOKEN` is the same secret the engine just
    # published with in this same run — a guard here would be testing something
    # already proven a job earlier.
    #
    # The SDK ships the version the engine ships (ADR 0002 puts every SDK on the
    # one version chain), which is what makes "the SDK for engine 0.x" readable
    # off the number instead of a compatibility matrix.
    needs: [prepare, verify-conformance]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.released == 'true' && (needs.verify-conformance.result == 'success' || needs.verify-conformance.outputs.exit_class == 'infra') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Same provenance attestation the engine's publish mints, for the same
      # reason: the registry records which workflow, at which commit, built it.
      id-token: write
    steps:
      # The tag, not the branch, for the same reason every publish job states:
      # `main` may have moved, and the tarball must hold the tagged bytes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # `registry-url` is what writes the .npmrc that reads NODE_AUTH_TOKEN
      # below. Without it the token is set and silently unused, and the publish
      # fails as unauthenticated.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # The SDK's analogue of `verify-package.mjs`, and it asks a different
      # question because this package ships SOURCE rather than a runnable tool:
      # it packs the tarball, installs it into a throwaway workspace beside the
      # compiler, and builds the rule the SDK's own documentation prints —
      # through the `@ecoma-io/archkeep-rule-sdk/assembly` specifier that
