      # package is scoped: the engine's own Publish step argues both, and the
      # licence consequence it names is why this package carries its own
      # LICENSE — measured here rather than assumed, by the verifier above,
      # which goes red when the file is absent because npm and pnpm then select
      # different files from the same tree. The dist-tag rule is the engine
      # Publish step's, verbatim — ADR 0002 puts every SDK on the engine's
      # version chain and npm refuses a bare prerelease publish.
      - name: Publish
        working-directory: packages/archkeep-rule-sdk-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ECOMA_NPM_ACCESS_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*)
              prerelease="${version#*-}"
              npm publish --provenance --access public --tag "${prerelease%%.*}"
              ;;
            *) npm publish --provenance --access public ;;
          esac

  publish-vsix:
    name: Publish the VS Code extension
    # Same output the npm job steers on: the extension shares the engine's
    # version by decision, so every release carries a vsix — a release without
    # one would break the pairing the version number promises. The gate
    # expression is the npm job's, verbatim — see the comment there; a
    # divergence between the two is a release that ships to one destination
    # and not the other.
    needs: [prepare, verify-conformance]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.released == 'true' && (needs.verify-conformance.result == 'success' || needs.verify-conformance.outputs.exit_class == 'infra') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # write because the .vsix is uploaded to the GitHub release below — the
      # one installable artifact this component has until a marketplace
      # publisher exists, and the durable record of what each release held
      # after one does.
      contents: write
    steps:
      # The tag, not the branch, for the same reason the npm job states: `main`
      # may have moved, and the vsix must hold the tagged bytes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same two steps CI runs on every pull request, here against the
      # exact bytes about to be uploaded and published: stage, pack, then open
      # the vsix and prove the runtime dependency and every module an install
      # needs are inside. Before upload, not after, because an asset on a
      # tagged release is a record people install from.
      - name: Package the VS Code extension
        run: node scripts/package-vsix.mjs packages/archkeep-vscode dist/archkeep-vscode.vsix

      - name: Prove the vsix holds what an install needs
        run: node scripts/verify-vsix.mjs dist/archkeep-vscode.vsix

      - name: Upload the vsix to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/archkeep-vscode.vsix

      # Publishing is guarded twice, and each guard SKIPs LOUDLY — a log line
      # and a step-summary entry saying so and why — never silently, because a
      # green release lane that shipped nothing is the exact defect the
      # prepare job's tripwire exists for. The vsix on the release above is
      # real either way.
      #
      # The first guard is the version itself: the marketplace cannot carry a
      # version with a semver prerelease suffix at all. vsce validates
      # `semver.prerelease(version)` unconditionally on publish — the
      # `--pre-release` flag does not bypass it, it only selects a target
      # (measured in the vsce 3.9.2 source this lane installs), and the
      # 1.0.0-rc.1 release failed this step on exactly that refusal. So a
      # candidate's `.vsix` lives on its GitHub release only, and the stable
      # cut is the first version the marketplace receives.
      #
      # The second guard is the PAT. The `ecoma-io` publisher account exists
      # and holds ECOMA_VSCE_PAT as of the 1.0.0-rc.1 release, but the guard
      # stays: an absent or rotated-away secret must skip with a reason, not
      # die as an unauthenticated vsce error. The secret is named
      # `ECOMA_VSCE_PAT` to match this workflow's other organisation secrets
      # (`ECOMA_NPM_ACCESS_TOKEN`, `ECOMA_PYPI_API_TOKEN`,
      # `ECOMA_CRATES_API_TOKEN`), and it reaches vsce through the environment
      # as `VSCE_PAT` — the exact name vsce documents reading, and not
      # renameable — never through `${{}}` interpolation into this script.
      - name: Publish to the marketplace, or say loudly why not
        env:
          VSCE_PAT: ${{ secrets.ECOMA_VSCE_PAT }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version="$(node -p "require('./packages/archkeep-vscode/package.json').version")"
          case "$version" in
            *-*)
              {
                echo "## Marketplace publish SKIPPED"
                echo ""
                echo "\`$TAG\` was released and its .vsix is on the GitHub release,"
                echo "but it was NOT published to the VS Code Marketplace: the"
                echo "marketplace cannot carry a version with a prerelease suffix"
                echo "('$version'), and vsce refuses the publish before contacting it."
                echo "The stable cut of this line publishes to the marketplace."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "SKIPPED, and here is why: $version carries a prerelease suffix, which the"
              echo "VS Code Marketplace does not support — vsce refuses the publish outright."
              echo "$TAG's .vsix is on the GitHub release. The stable cut publishes."
              exit 0
              ;;
          esac
          if [ -z "$VSCE_PAT" ]; then
            {
              echo "## Marketplace publish SKIPPED"
              echo ""
              echo "\`$TAG\` was released and its .vsix is on the GitHub release,"
              echo "but it was NOT published to the VS Code Marketplace: the"
              echo "ECOMA_VSCE_PAT secret is absent. Restore the publisher's PAT as"
              echo "the ECOMA_VSCE_PAT repository secret, and the next release publishes."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "SKIPPED, and here is why: ECOMA_VSCE_PAT is absent, so $TAG was NOT published"
            echo "to the VS Code Marketplace. The .vsix is on the GitHub release. Restore the"
            echo "ECOMA_VSCE_PAT secret to turn publishing on."
            exit 0
          fi
          pnpm --dir packages/archkeep-vscode exec vsce publish --packagePath "$GITHUB_WORKSPACE/dist/archkeep-vscode.vsix"
          {
            echo "## Marketplace publish"
            echo ""
            echo "\`$TAG\` was published to the VS Code Marketplace from the vsix on its GitHub release."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-go-module:
    name: Tag the Go rule SDK for the module proxy
    # For Go, the tag IS the publish. A Go module carries no manifest version
    # and there is no registry to upload to: `go get` reads the module path,
    # fetches the repository, and looks for a tag — and for a module below the
    # repository root that tag is prefixed with the module's own directory,
    # `packages/archkeep-rule-sdk-go/v<version>` rather than the bare
    # `v<version>` release-please already cuts.
    #
    # Nothing minted it, while `packages/archkeep-rule-sdk-go/go.mod` and
    # docs/adr/0002-custom-rules-one-contract.md both said this lane did. That
    # is the failure with no observable: `go get` falls back to a pseudo-version
    # off the default branch, which installs and builds, so nobody could tell a
    # released version from one that was never cut.
    #
    # The gate expression is the npm job's, verbatim — see the comment there;
    # a divergence between the publish jobs is a release that ships to one
    # destination and not another.
    #
    # `contents: write` is the narrowest permission that can create a ref, and
    # it is the only job below `prepare` that writes anything to this
    # repository. The tag it creates cannot start a workflow run: this file
    # triggers on `push` to `main` branches, and a tag ref is neither.
    needs: [prepare, verify-conformance]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.released == 'true' && (needs.verify-conformance.result == 'success' || needs.verify-conformance.outputs.exit_class == 'infra') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The tag, not the branch, for the same reason every publish job states —
      # and here it is also what the new tag must POINT AT, so the checked-out
      # commit is read back below rather than assumed to be `main`'s head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      # Re-proving the module from the tagged bytes, the way the crates.io job
      # re-proves the crate: the runner's preinstalled Go is the toolchain, and
      # `go.mod`'s own floor is what decides whether it is new enough — a
      # `setup-go` pin here would be a second copy of that number.
      - name: Prove the tagged module builds and passes its own suite
        working-directory: packages/archkeep-rule-sdk-go
        run: |
          go build ./...
          go test ./...

      # The tag is created through the API rather than `git tag && git push`,
      # for the reason `scripts/push-reformatted-files.mjs` states about
      # commits: a ref created by the API carries the workflow identity, and
      # the checkout above deliberately kept no credentials to push with.
      # `scripts/tag-go-module.mjs` derives the tag name from go.mod rather
      # than restating it here, refuses a module path that does not resolve to
      # this repository and this directory, and reads the ref back after
      # writing it.
      - name: Mint the module's version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/tag-go-module.mjs \
            --version "$TAG" \
            --sha "$(git rev-parse HEAD)"

  publish-pypi:
    name: Publish the Python rule SDK to PyPI
    # The gate expression is the npm job's, verbatim — see the comment there;
    # a divergence between the publish jobs is a release that ships to one
    # destination and not another.
    #
    # This destination is guarded on the PACKAGE rather than on a secret: the
    # Python rule SDK (`packages/archkeep-rule-sdk-python`) is staged by
    # docs/adr/0002-custom-rules-one-contract.md and has not landed yet, so on
    # a release whose tag carries no such package this job says loudly that
    # there was nothing to publish — the marketplace step's own arrangement,
    # for the same reason: a silent skip and a covered destination read
    # identically on a green lane. The two guards fail in DIFFERENT
    # directions on purpose: package absent is the ordinary state and skips
    # loudly with exit 0, while package present with an empty token FAILS —
    # a release that carries a Python package and does not reach PyPI is the
    # lane shipping nothing under a green light, the exact defect the
    # prepare job's tripwire exists for. The token is the ECOMA_PYPI_API_TOKEN
    # organisation secret; it reaches twine only through the environment
    # (TWINE_PASSWORD, documented by twine), never through `${{}}`
    # interpolation into a script body, and an org secret must be GRANTED to
    # this repository to be non-empty here — the failure message names that,
    # because a granted-to-other-repos secret reads exactly like a missing
    # one.
    #
    # The build tools are version-pinned (measured against PyPI 2026-08-21:
    # build 1.5.0, twine 7.0.0 are current) so the lane cannot drift under a
    # release; the runner's own python3 builds the sdist and wheel. When the
    # package lands, its pre-publish proof — the verify-package analogue that
    # installs the built distribution somewhere that is not this workspace —
    # arrives in the same change, the arrangement the ADR's release section
    # states.
    needs: [prepare, verify-conformance]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.released == 'true' && (needs.verify-conformance.result == 'success' || needs.verify-conformance.outputs.exit_class == 'infra') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The tag, not the branch, for the same reason every publish job states:
      # `main` may have moved, and the distribution must hold the tagged bytes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Find the Python rule SDK in this release, or say loudly why not
        id: sdk
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -f packages/archkeep-rule-sdk-python/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## PyPI publish SKIPPED"
              echo ""
              echo "\`$TAG\` carries no \`packages/archkeep-rule-sdk-python\` package, so"
              echo "nothing was published to PyPI. The Python rule SDK is staged by"
              echo "ADR 0002 and has not landed; the release that first carries it"
              echo "publishes it from this job with no workflow change."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "SKIPPED, and here is why: $TAG carries no packages/archkeep-rule-sdk-python,"
            echo "so there is no Python distribution to publish. The job goes live with the"
            echo "release that first ships that package."
          fi

      - name: Build the distribution
        if: steps.sdk.outputs.present == 'true'
        run: |
          python3 -m pip install --upgrade 'build==1.5.0' 'twine==7.0.0'
          python3 -m build packages/archkeep-rule-sdk-python

      - name: Publish to PyPI
        if: steps.sdk.outputs.present == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.ECOMA_PYPI_API_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "$TAG carries packages/archkeep-rule-sdk-python, but ECOMA_PYPI_API_TOKEN"
            echo "is empty in this repository's context. It is an organisation secret, so"
            echo "either it was removed or it is not granted to this repository — grant it"
            echo "under the organisation's Actions secrets, then re-run this job. Failing"
            echo "red rather than skipping: a release that carries a Python package and"
            echo "does not reach PyPI is the lane shipping nothing under a green light."
            exit 1
          fi
          python3 -m twine upload --non-interactive packages/archkeep-rule-sdk-python/dist/*

  publish-crates:
    name: Publish the Rust rule SDK to crates.io
    # The gate expression is the npm job's, verbatim — see the comment there;
    # a divergence between the publish jobs is a release that ships to one
    # destination and not another.
    #
    # Unlike the PyPI job above, this destination's package IS in the tree, so
    # the job publishes on every release and its only guard is the token — a
    # guard that fails RED rather than skipping: the crate is in the tagged
    # bytes, and a release that does not reach crates.io is the lane shipping
    # nothing under a green light, the prepare job's tripwire defect by
    # another door. The token is the ECOMA_CRATES_API_TOKEN organisation
    # secret — that exact spelling is the name it was created under — and it
    # reaches cargo only through the environment (CARGO_REGISTRY_TOKEN,
    # cargo's own documented variable), never through `${{ }}` interpolation.
    # An org secret must also be GRANTED to this repository to be non-empty
    # here; the failure message names the secret and the grant, because a
    # granted-to-other-repos secret reads exactly like a missing one.
    #
    # Before anything uploads, the job re-proves the tagged bytes three ways,
    # because a crates.io version cannot be deleted, only yanked: the crate
    # version must equal the tag's (read by the SAME parser check-skills
    # uses — a second sed here would be the two-copies drift that gate
    # exists to end), the crate's own suite runs, and `cargo publish
    # --dry-run --locked` packages and verify-builds exactly what the real
    # publish would upload. Measured before this job existed: the dry run
    # packages 23 files, 227KiB, verify green, on the preinstalled cargo —
    # nothing here needs clippy or the wasm target, because the committed
    # example artifact ships as bytes and `rebuild-example.sh` stays a
    # contributor command.
    needs: [prepare, verify-conformance]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.released == 'true' && (needs.verify-conformance.result == 'success' || needs.verify-conformance.outputs.exit_class == 'infra') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The tag, not the branch, for the same reason every publish job states:
      # `main` may have moved, and the crate must hold the tagged bytes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Prove the tagged crate carries the tagged version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { tomlSectionVersion } from "./scripts/check-skills.mjs";
            const version = tomlSectionVersion(
              readFileSync("packages/archkeep-rule-sdk-rust/Cargo.toml", "utf8"),
              "[package]",
            );
            const tag = process.env.TAG;
            if (`v${version}` !== tag) {
              console.error(
                `Cargo.toml says ${version} but the tag is ${tag}. release-please ` +
                  "writes this manifest via extra-files and check-skills holds the " +
                  "chain on every pull request; if they disagree HERE, the chain " +
                  "broke after the last gate that looked, and publishing would " +
                  "upload a number that is not the release. crates.io uploads " +
                  "cannot be deleted, so this stops before the upload.",
              );
              process.exit(1);
            }
          '

      - name: Prove the crate publishes before publishing it
        working-directory: packages/archkeep-rule-sdk-rust
        run: |
          cargo test --locked
          cargo publish --dry-run --locked

      - name: Publish to crates.io
        working-directory: packages/archkeep-rule-sdk-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.ECOMA_CRATES_API_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "$TAG carries packages/archkeep-rule-sdk-rust, but ECOMA_CRATES_API_TOKEN"
            echo "is empty in this repository's context. It is an organisation secret, so"
            echo "either the name differs (check the exact spelling — CRATES) or it is"
            echo "not granted to this repository; grant it under the organisation's"
            echo "Actions secrets, then re-run this job. Failing red rather than"
            echo "skipping: the crate is in the tagged bytes, and a release that does"
            echo "not reach crates.io is the lane shipping nothing under a green light."
            exit 1
          fi
          cargo publish --locked
