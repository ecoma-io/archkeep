name: Release

# Releasing is two things, and only the first happens on most pushes.
#
# release-please watches `main` and keeps one pull request open holding the next
# version and the changelog it derived from the conventional commits since the
# last tag. That pull request *is* the release proposal: merging it is what
# tags, and the tag is what publishes.
#
# One component releases from here, to the two destinations that can serve it.
# The npm package ships to the registry and nothing else: an Nx plugin reaches
# a workspace through its `node_modules` or it does not reach it at all, so its
# release carries no assets. litmus, the sibling this workflow is modelled on,
# also builds a reproducible tarball and has SLSA sign it — because a skills
# package is consumed by `curl` as often as by `npm i`; that does not apply
# here. The VS Code extension is the reverse case: npm can never serve it (its
# manifest is `private: true` on purpose), so the SAME release carries an
# asset — the .vsix, the one file a person can install by hand — and the
# marketplace publish is guarded below until a publisher account exists.
# Extension and engine share one version by decision, not by accident: a client
# that resolves the server out of the workspace pairs with the engine it is
# released with, and one version makes the pairing visible.
#
# Two more destinations ride the same release, differently guarded because
# their packages are in different states. The crates.io job serves the Rust
# rule SDK (`packages/lattice-rule-sdk-rust`), which IS in the tree: it
# publishes on every release, re-proving the crate from the tagged bytes
# first, and an empty token fails it red. The PyPI job serves the Python rule
# SDK (`packages/lattice-rule-sdk-python`,
# docs/adr/0002-custom-rules-one-contract.md stages it), which does not exist
# in the tree yet: until a tagged release carries that package the job says
# loudly that there was nothing to publish — the marketplace step's own
# pattern — and the moment the package lands, the same release that ships the
# engine ships it, under the one version everything here shares.
#
# The releases' lack of signatures on the GitHub release object is named rather
# than discovered later: the plugin releases carry no asset to sign, and the
# vsix is uploaded unsigned. npm provenance — the `--provenance` flag below — is
# a real attestation, published to Sigstore's transparency log and shown on the
# package page, but it lives at the registry rather than on the GitHub release.
# The trade is deliberate: an artifact built or signed only to hold a signature
# would be an asset nobody installs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # Hoisted so the App-token step below has something its `if:` is allowed
    # to read — see that step for why it cannot test `secrets` itself. Only
    # the id is lifted: the private key is passed straight into the action's
    # `with:`, where the `secrets` context IS available, so it never becomes
    # an environment variable any later step in this job could read.
    env:
      RELEASE_APP_ID: ${{ secrets.ECOMA_APP_ID }}
    outputs:
      # One component, one output pair. release-please emits the un-prefixed
      # `release_created` and `tag_name` only for a component at the repository
      # ROOT; every path in a manifest gets `<path>--<name>` instead. The
      # component sits at the root (`"."` in release-please-config.json), so
      # its pair is the un-prefixed one, and EVERY publish job — npm, vsix,
      # PyPI, crates.io — steers on it. This workflow once read the `packages/lattice--`-prefixed
      # pair while the component was keyed by its package path — which in a
      # manifest configuration names the release-please output for that path —
      # so it evaluated to the empty string, `released == 'true'` was false,
      # and `publish` skipped.
      #
      # Measured on the first real release rather than reasoned: `Release`
      # reported success, the tag and the GitHub release both existed, the log
      # said `✔ Creating 1 releases for pull #4` — and npm still answered 404.
      # A green lane that published nothing is exactly the silence this
      # repository refuses, and the second output is why a partial fix would
      # have kept it: correcting only `released` would have run `publish` with an
      # empty `tag`, and `actions/checkout` treats an empty `ref` as the default
      # branch. That publishes whatever `main` holds under the tagged version's
      # number — the one mistake npm does not let you take back.
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # The escape hatch, now ON — and the condition it was written for is the
      # one that happened. GitHub documents that events raised with
      # `GITHUB_TOKEN` do not start new workflow runs, which leaves a release
      # pull request with no `ci-gate` and no `analysis-gate`: the two checks
      # required to merge it.
      #
      # This note used to record the opposite, from litmus, which runs the same
      # arrangement: CI and Analysis both ran there against release pull
      # requests on the workflow token alone. That is not what this repository
      # gets. Measured across every release branch it has cut, both required
      # runs arrive with conclusion `action_required` and ZERO jobs — created,
      # never started — so the pull request sits at `mergeable_state: blocked`
      # with nothing red to open, and every run that ever reached `success`
      # carries `run_attempt: 2`. That is a hand on every release since 0.1.0,
      # absorbed each time by whoever cut it. Where the documented behaviour
      # and litmus disagreed, the documentation was right about this repository.
      #
      # So the token is minted: an App token is an ordinary actor, and its pull
      # request triggers CI the way a contributor's does.
      #
      # The credentials are organisation SECRETS (`ECOMA_APP_ID`,
      # `ECOMA_APP_KEY`), not variables. A `vars.` gate against a
      # secret-stored id is precisely what kept this step skipped for seven
      # releases while everything read as configured.
      #
      # The gate therefore reads `env`, hoisted from the secret at job level,
      # and NOT `secrets` directly. That is not a style choice, and it is
      # worth the sentence because GitHub's own documentation contradicts
      # itself here: the context-availability table lists `secrets` among the
      # contexts for `jobs.<job_id>.steps.if`, while the secrets guide states
      # flatly that "Secrets cannot be directly referenced in `if:`
      # conditionals" and prescribes exactly this hoist. The runtime agrees
      # with the guide — measured, not reasoned: `if: secrets.ECOMA_APP_ID
      # != ''` took the whole lane to a startup failure, a run with zero jobs
      # and no log to read, which is the least diagnosable red a workflow can
      # produce. Read the table, believe the guide.
      - name: Mint a GitHub App token
        id: app-token
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ECOMA_APP_ID }}
          private-key: ${{ secrets.ECOMA_APP_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please re-serializes every JSON `extra-file` it bumps, and its
      # layout is not Prettier's: a one-line array it writes as multiple lines,
      # where `printWidth: 100` keeps it on one. Without a fix, the release pull
      # request fails CI's `format:check` on the files this very lane just wrote
      # — the same defect as `CHANGELOG.md` (which `.prettierignore` already
      # exempts) but for five files no human wrote. Fix them in place, on the
      # branch release-please pushed, before CI ever sees the pull request.
      # The sixth extra-file, the Rust SDK's Cargo.toml, stays OFF the list
      # below on purpose: Prettier has no TOML parser (naming the file errors
      # the run), and no gate checks TOML layout, so there is nothing to fix.
      #
      # The branch is read from the `pr` output rather than named: release-please
      # creates `release-please--branches--<base>--components--<component>`, and
      # the manifest keys a component by its path, so naming it here would be a
      # second copy that drifts. The output is a serialized JSON object carrying
      # `headBranchName` — and it is empty exactly when release-please found
      # nothing to change (a release-less push), which is also when there is
      # nothing to reformat, so the gate is the same condition and the checkout,
      # install and reformat all key off it.
      #
      # The push is NOT a `git commit` from this step: the repository's `main`
      # ruleset requires a signature on every branch commit
      # (`required_signatures`, read from `gh api rulesets`), and a commit a
      # workflow creates with `git config user.name ...` + `git commit` is
      # unsigned — release PR #75 sat with every check green and
      # `mergeable_state: BLOCKED` for exactly that reason, nothing naming it.
      # So the reformat lands through the git-database REST API
      # (`scripts/push-reformatted-files.mjs`): POST /git/trees (inline
      # `content`, the encoding release-please itself uses), POST /git/commits,
      # PATCH /git/refs. Called with NO author or committer — measured,
      # 2026-08-18, both directions: an explicit identity comes back `unsigned`;
      # the default comes back author `github-actions[bot]`, committer
      # `GitHub <noreply@github.com>`, `verification.reason: "valid"` — the
      # same web-flow signature release-please's own commit carries. A personal
      # access token produces unsigned commits on the same call shape, so the
      # step passes `${{ github.token }}` (or the App token when
      # `ECOMA_APP_ID` is set — App-token API commits carry the app's
      # signature, also verified). The script refuses success if the new head
      # does not come back `valid`, so an unmergeable release branch fails red
      # in-lane instead of after the fact.
      #
      # The commit message stays `chore: reformat release-please extra-files`
      # and the author identity is still effectively `github-actions[bot]`,
      # so the reformat lands as part of the release, not as a contributor
      # edit.
      - name: Reformat release-please extra-files
        if: steps.release.outputs.pr != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.release.outputs.pr != ''

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.release.outputs.pr != ''
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Reformat release-please extra-files and push
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          pnpm install --frozen-lockfile

          pnpm exec prettier --write \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            .codex-plugin/plugin.json \
            packages/lattice/package.json \
            packages/lattice-vscode/package.json

          if git diff --quiet; then
            echo "no reformatting needed; nothing to push"
          else
            node scripts/push-reformatted-files.mjs \
              --root "$GITHUB_WORKSPACE" \
              --branch "${{ fromJSON(steps.release.outputs.pr).headBranchName }}"
          fi

      # The tripwire for the defect above coming back by another spelling.
      # `paths_released` is the top-level output naming every path release-please
      # cut a release for, and it carries no prefix to get wrong. So it and the
      # output the publish jobs steer on must agree: a run that created a release
      # while `release_created` reads empty is precisely the state that published
      # nothing and reported success, and it fails here instead — naming the
      # values rather than leaving a reader to infer which one lied. Every
      # publish job — npm, vsix, PyPI, crates.io — keys off the SAME output,
      # so one check guards them all.
      # If a second component is ever added back, its path needs a check here
      # too, because the per-path outputs are exactly the spelling that drifted
      # once.
      #
      # A release-less run is the ordinary case for every commit that merely
      # updates a release pull request, so an empty list fires nothing.
      - name: Fail if a release was cut that a publish job cannot see
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
          GRAPH_RELEASED: ${{ steps.release.outputs.release_created }}
        run: |
          if printf '%s' "$PATHS_RELEASED" | grep -qF '"."' && [ "$GRAPH_RELEASED" != "true" ]; then
            echo "release-please created a release for the root, but the output"
            echo "both publish jobs steer on did not report it:"
            echo "  paths_released = $PATHS_RELEASED"
            echo "  release_created read '$GRAPH_RELEASED'"
            echo ""
            echo "release-please-config.json and this workflow have drifted."
            echo "Publish would skip and this lane would report success having"
            echo "shipped nothing."
            exit 1
          fi

  # The conformance differential, re-run against the TAGGED bytes this lane is
  # about to ship. `.github/workflows/differential.yml`'s schedule measures
  # `main`; only this job measures the exact code the tag carries, so a
  # release never carries a parity claim the weekly sample did not look at.
  # It is the same refuse-to-ship-unproven-bytes decision as
  # `verify-package.mjs` above, applied to the boundary engine's central
  # guarantee instead of the resolver's.
  #
  # Two classes of red, two consequences — the split
  # `.github/workflows/differential.yml`'s header owns, spelled by the ONE
  # vocabulary in `scripts/differential-real-trees.mjs`'s `buildSummary` and
  # read back here through `--exit-class-of`:
  #
  # - findings (an unexplained difference, a stale ledger entry, an empty
  #   verdict): the step fails, `exit_class` is `findings`, and the publish
  #   jobs below SKIP. A release whose central claim is known-false must not
  #   ship, and the lane shows the red that explains why — followed by a
  #   skipped publish, never a silent one.
  # - infra (clone/install/graph could not run): the job fails TOO — a run
  #   that could not look must not read as one that looked — but
  #   `exit_class` is `infra`, the publish jobs proceed, and this job's red
  #   stays standing in the lane as the loud "parity UNVERIFIED" label.
  #   Blocking a release on third-party reachability is the exact deletion
  #   pressure the differential's header refuses; shipping under a
  #   findings-red is the one line this lane must never cross.
  #
  # The waiver expression in every publish job is that line, in code: it
  # names `exit_class == 'infra'` explicitly — nothing else waives. An
  # UNREADABLE summary yields an empty `exit_class`, `== 'infra'` is false,
  # and the release is blocked: fail-closed is the direction this must err
  # in, because a release must not carry a parity claim of unknown class.
  # Note the form of the guard too: `result == 'success'`, not
  # `result != 'failure'` — a skipped or cancelled job must read as BLOCKED,
  # because GitHub reports a skipped job as Success on the checks UI. Keep
  # every publish job's condition identical; a divergence between them is
  # a release that ships to one destination and not another.
  verify-conformance:
    name: Differential against real trees (gate)
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      exit_class: ${{ steps.differential.outputs.exit_class }}
    steps:
      # The tag, not the branch — the same reason every publish job states
      # it: `main` has already moved on, and the verdict must be about the
      # bytes this release carries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The step keeps the job RED on both classes (the exit code is
      # re-exited, never swallowed); `exit_class` is read back from the
      # envelope the script wrote, so the spelling lives exactly once.
      # A run that exits 0 but writes no envelope is also coerced to red —
      # a green run with no summary is the silent direction, and if the
      # summary is missing for any reason the class falls to `infra`, the
      # fail-open-with-a-label branch, never to a silent `success`.
      - name: Run the differential
        id: differential
        run: |
          set +e
          node scripts/differential-real-trees.mjs --summary-out "$RUNNER_TEMP/differential-summary.json"
          code=$?
          if [ -f "$RUNNER_TEMP/differential-summary.json" ]; then
            exit_class="$(node scripts/differential-real-trees.mjs --exit-class-of "$RUNNER_TEMP/differential-summary.json")"
          else
            [ "$code" -eq 0 ] && code=3
            exit_class="infra"
          fi
          echo "exit_class=$exit_class" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

  publish:
    name: Publish to npm
    # The gate's contract, as the `verify-conformance` job's header spells it:
    # proceed when the differential passed, or when it FAILED only because it
    # could not look (`exit_class == 'infra'` — that job's red stays standing
    # as the loud UNVERIFIED label). `== 'success'`, deliberately, not
    # `!= 'failure'`: a skipped or cancelled gate must BLOCK, because a
    # skipped job reports as Success on the checks UI. Keep this expression
    # identical to the other publish jobs' — a divergence ships one
    # destination and not another.
    #
    # `!cancelled()` is load-bearing, not decoration. GitHub ANDs an implicit
    # `success()` onto any `if:` that names no status-check function
    # (`success`/`failure`/`always`/`cancelled`), and a job's implicit
    # `success()` requires every job it `needs` — `verify-conformance`
    # included — to have itself concluded `success`. `verify-conformance`'s
    # own header says its job "fails TOO" on the infra class, not only the
    # findings class, so `needs.verify-conformance.outputs.exit_class ==
    # 'infra'` and an implicit `success()` can never both hold: without an
    # explicit status check here, the waiver this expression exists to grant
    # is exactly the case GitHub's own implicit gate forecloses first, and
    # this job would silently skip every time the waiver was meant to fire.
    # `!cancelled()` is the documented way to opt out of that implicit gate —
    # preferred over `always()` because `always()` would also proceed
    # through a run an operator cancelled, which this must not. It sits at
    # the END of the expression rather than the front for a YAML reason: a
    # bare scalar (every `if:` in this workflow is one) cannot START with
    # `!`, the tag indicator, and `&&` does not care about operand order.
    # `needs.prepare.result == 'success'` is restated explicitly for the
    # same reason `!cancelled()` is: it was riding on the implicit
    # `success()` too, and simply opting out would have silently dropped
    # that protection along with the bug.
    needs: [prepare, verify-conformance]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.released == 'true' && (needs.verify-conformance.result == 'success' || needs.verify-conformance.outputs.exit_class == 'infra') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for a provenance attestation: npm
      # records which workflow, at which commit, built the package, and shows it
      # on the package page.
      id-token: write
    steps:
      # The tag, not the branch: `main` has already moved on by the time this
      # runs if anything merged behind the release pull request, and publishing
      # a version whose contents are not the tagged ones is the one mistake npm
      # will not let you take back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # `registry-url` is what writes the .npmrc that reads NODE_AUTH_TOKEN
      # below. Without it the token is set and silently unused, and the publish
      # fails as unauthenticated.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # The package must work for someone who is not this workspace, and the
      # only place that is checkable is here, against the exact bytes about to
      # ship. `pnpm pack` writes the tarball the registry would receive; the
      # step installs it into a throwaway workspace with its own tag vocabulary
      # and drives the three things a consumer buys — the plugin loads inside a
      # real `nx graph`, the checker exits 0 on a clean tree, and it exits 1 on
      # a violating one. The last is the one that matters: a gate only proves it
      # runs when it can go red. It also asserts the can't-look exit (3) on a
      # markerless tree and that `npm pack --dry-run` selects the same files
      # `pnpm pack` verified — the bytes published are the bytes proven.
      #
      # Every job in this file runs `ubuntu-latest`; the script shells out to
      # `pnpm` and `npm` by PATH and is unix-only by design.
      #
      # It runs before publish, not after, because a package that resolves
      # nothing at install time cannot be unpublished away.
      - name: Prove the packed artifact works outside this workspace
        run: node scripts/verify-package.mjs packages/lattice

      # The full E2E suite, run against the exact tag checkout, same as
      # verify-package.mjs above. A version that fails E2E cannot be unpublished
      # away.
      - name: E2E full tests (pre-publish)
        run: pnpm e2e

      # `npm publish`, not `pnpm publish`: provenance is an npm CLI feature and
      # this is the client that implements it. That choice has a consequence the
      # package carries — npm does not copy the repository-root LICENSE into a
      # tarball the way `pnpm pack` does, which is why the package holds its own
      # copy. Without it an Apache-2.0 package would publish with no licence.
      #
      # `--access public` is required because the package is scoped: a scoped
      # package defaults to restricted, and the first publish would otherwise
      # create a private package on a plan that may not allow one.
      #
      # `NODE_AUTH_TOKEN` rather than OIDC trusted publishing, and only because
      # of an ordering rule: trusted publishing cannot create a package that
      # does not exist yet, so the first version of a name has to go through a
      # token. Once `@ecoma-io/lattice` exists on the registry, bind
      # this workflow as a trusted publisher there and delete the `env:` block —
      # the `id-token: write` above is already what that mode needs.
      - name: Publish
        working-directory: packages/lattice
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ECOMA_NPM_ACCESS_TOKEN }}
        run: npm publish --provenance --access public

  publish-vsix:
    name: Publish the VS Code extension
    # Same output the npm job steers on: the extension shares the engine's
    # version by decision, so every release carries a vsix — a release without
    # one would break the pairing the version number promises. The gate
    # expression is the npm job's, verbatim — see the comment there; a
    # divergence between the two is a release that ships to one destination
    # and not the other.
    needs: [prepare, verify-conformance]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.released == 'true' && (needs.verify-conformance.result == 'success' || needs.verify-conformance.outputs.exit_class == 'infra') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # write because the .vsix is uploaded to the GitHub release below — the
      # one installable artifact this component has until a marketplace
      # publisher exists, and the durable record of what each release held
      # after one does.
      contents: write
    steps:
      # The tag, not the branch, for the same reason the npm job states: `main`
      # may have moved, and the vsix must hold the tagged bytes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same two steps CI runs on every pull request, here against the
      # exact bytes about to be uploaded and published: stage, pack, then open
      # the vsix and prove the runtime dependency and every module an install
      # needs are inside. Before upload, not after, because an asset on a
      # tagged release is a record people install from.
      - name: Package the VS Code extension
        run: node scripts/package-vsix.mjs packages/lattice-vscode dist/lattice-vscode.vsix

      - name: Prove the vsix holds what an install needs
        run: node scripts/verify-vsix.mjs dist/lattice-vscode.vsix

      - name: Upload the vsix to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/lattice-vscode.vsix

      # Publishing is guarded, not wired to a publisher that does not exist
      # yet: the `ecoma-io` marketplace publisher account has not been created,
      # so there is no VSCE_PAT secret to hold. When the secret is absent this
      # step SKIPS LOUDLY — a log line and a step-summary entry saying so and
      # why — never silently, because a green release lane that shipped nothing
      # is the exact defect the prepare job's tripwire exists for. The vsix on
      # the release above is real either way. The secret reaches vsce through
      # the environment (vsce documents reading VSCE_PAT), never through `${{}}`
      # interpolation into this script.
      #
      # To turn publishing on: create the publisher, mint a marketplace PAT,
      # store it as the VSCE_PAT repository secret. No workflow change needed.
      - name: Publish to the marketplace, or say loudly why not
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            {
              echo "## Marketplace publish SKIPPED"
              echo ""
              echo "\`$TAG\` was released and its .vsix is on the GitHub release,"
              echo "but it was NOT published to the VS Code Marketplace: the"
              echo "VSCE_PAT secret is absent because the publisher account does"
              echo "not exist yet. Create the publisher, store its PAT as the"
              echo "VSCE_PAT repository secret, and the next release publishes."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "SKIPPED, and here is why: VSCE_PAT is absent (no marketplace publisher account"
            echo "exists yet), so $TAG was NOT published to the VS Code Marketplace. The .vsix"
            echo "is on the GitHub release. Store a VSCE_PAT secret to turn publishing on."
            exit 0
          fi
          pnpm --dir packages/lattice-vscode exec vsce publish --packagePath "$GITHUB_WORKSPACE/dist/lattice-vscode.vsix"
          {
            echo "## Marketplace publish"
            echo ""
            echo "\`$TAG\` was published to the VS Code Marketplace from the vsix on its GitHub release."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-pypi:
    name: Publish the Python rule SDK to PyPI
    # The gate expression is the npm job's, verbatim — see the comment there;
    # a divergence between the publish jobs is a release that ships to one
    # destination and not another.
    #
    # This destination is guarded on the PACKAGE rather than on a secret: the
    # Python rule SDK (`packages/lattice-rule-sdk-python`) is staged by
    # docs/adr/0002-custom-rules-one-contract.md and has not landed yet, so on
    # a release whose tag carries no such package this job says loudly that
    # there was nothing to publish — the marketplace step's own arrangement,
    # for the same reason: a silent skip and a covered destination read
    # identically on a green lane. The two guards fail in DIFFERENT
    # directions on purpose: package absent is the ordinary state and skips
    # loudly with exit 0, while package present with an empty token FAILS —
    # a release that carries a Python package and does not reach PyPI is the
    # lane shipping nothing under a green light, the exact defect the
    # prepare job's tripwire exists for. The token is the ECOMA_PYPI_API_TOKEN
    # organisation secret; it reaches twine only through the environment
    # (TWINE_PASSWORD, documented by twine), never through `${{}}`
    # interpolation into a script body, and an org secret must be GRANTED to
    # this repository to be non-empty here — the failure message names that,
    # because a granted-to-other-repos secret reads exactly like a missing
    # one.
    #
    # The build tools are version-pinned (measured against PyPI 2026-08-21:
    # build 1.5.0, twine 7.0.0 are current) so the lane cannot drift under a
    # release; the runner's own python3 builds the sdist and wheel. When the
    # package lands, its pre-publish proof — the verify-package analogue that
    # installs the built distribution somewhere that is not this workspace —
    # arrives in the same change, the arrangement the ADR's release section
    # states.
    needs: [prepare, verify-conformance]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.released == 'true' && (needs.verify-conformance.result == 'success' || needs.verify-conformance.outputs.exit_class == 'infra') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The tag, not the branch, for the same reason every publish job states:
      # `main` may have moved, and the distribution must hold the tagged bytes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Find the Python rule SDK in this release, or say loudly why not
        id: sdk
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -f packages/lattice-rule-sdk-python/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## PyPI publish SKIPPED"
              echo ""
              echo "\`$TAG\` carries no \`packages/lattice-rule-sdk-python\` package, so"
              echo "nothing was published to PyPI. The Python rule SDK is staged by"
              echo "ADR 0002 and has not landed; the release that first carries it"
              echo "publishes it from this job with no workflow change."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "SKIPPED, and here is why: $TAG carries no packages/lattice-rule-sdk-python,"
            echo "so there is no Python distribution to publish. The job goes live with the"
            echo "release that first ships that package."
          fi

      - name: Build the distribution
        if: steps.sdk.outputs.present == 'true'
        run: |
          python3 -m pip install --upgrade 'build==1.5.0' 'twine==7.0.0'
          python3 -m build packages/lattice-rule-sdk-python

      - name: Publish to PyPI
        if: steps.sdk.outputs.present == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.ECOMA_PYPI_API_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "$TAG carries packages/lattice-rule-sdk-python, but ECOMA_PYPI_API_TOKEN"
            echo "is empty in this repository's context. It is an organisation secret, so"
            echo "either it was removed or it is not granted to this repository — grant it"
            echo "under the organisation's Actions secrets, then re-run this job. Failing"
            echo "red rather than skipping: a release that carries a Python package and"
            echo "does not reach PyPI is the lane shipping nothing under a green light."
            exit 1
          fi
          python3 -m twine upload --non-interactive packages/lattice-rule-sdk-python/dist/*

  publish-crates:
    name: Publish the Rust rule SDK to crates.io
    # The gate expression is the npm job's, verbatim — see the comment there;
    # a divergence between the publish jobs is a release that ships to one
    # destination and not another.
    #
    # Unlike the PyPI job above, this destination's package IS in the tree, so
    # the job publishes on every release and its only guard is the token — a
    # guard that fails RED rather than skipping: the crate is in the tagged
    # bytes, and a release that does not reach crates.io is the lane shipping
    # nothing under a green light, the prepare job's tripwire defect by
    # another door. The token is the ECOMA_CREATES_API_TOKEN organisation
    # secret — that exact spelling is the name it was created under — and it
    # reaches cargo only through the environment (CARGO_REGISTRY_TOKEN,
    # cargo's own documented variable), never through `${{ }}` interpolation.
    # An org secret must also be GRANTED to this repository to be non-empty
    # here; the failure message names the secret and the grant, because a
    # granted-to-other-repos secret reads exactly like a missing one.
    #
    # Before anything uploads, the job re-proves the tagged bytes three ways,
    # because a crates.io version cannot be deleted, only yanked: the crate
    # version must equal the tag's (read by the SAME parser check-skills
    # uses — a second sed here would be the two-copies drift that gate
    # exists to end), the crate's own suite runs, and `cargo publish
    # --dry-run --locked` packages and verify-builds exactly what the real
    # publish would upload. Measured before this job existed: the dry run
    # packages 23 files, 227KiB, verify green, on the preinstalled cargo —
    # nothing here needs clippy or the wasm target, because the committed
    # example artifact ships as bytes and `rebuild-example.sh` stays a
    # contributor command.
    needs: [prepare, verify-conformance]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.released == 'true' && (needs.verify-conformance.result == 'success' || needs.verify-conformance.outputs.exit_class == 'infra') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The tag, not the branch, for the same reason every publish job states:
      # `main` may have moved, and the crate must hold the tagged bytes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Prove the tagged crate carries the tagged version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { cargoPackageVersion } from "./scripts/check-skills.mjs";
            const version = cargoPackageVersion(
              readFileSync("packages/lattice-rule-sdk-rust/Cargo.toml", "utf8"),
            );
            const tag = process.env.TAG;
            if (`v${version}` !== tag) {
              console.error(
                `Cargo.toml says ${version} but the tag is ${tag}. release-please ` +
                  "writes this manifest via extra-files and check-skills holds the " +
                  "chain on every pull request; if they disagree HERE, the chain " +
                  "broke after the last gate that looked, and publishing would " +
                  "upload a number that is not the release. crates.io uploads " +
                  "cannot be deleted, so this stops before the upload.",
              );
              process.exit(1);
            }
          '

      - name: Prove the crate publishes before publishing it
        working-directory: packages/lattice-rule-sdk-rust
        run: |
          cargo test --locked
          cargo publish --dry-run --locked

      - name: Publish to crates.io
        working-directory: packages/lattice-rule-sdk-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.ECOMA_CREATES_API_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "$TAG carries packages/lattice-rule-sdk-rust, but ECOMA_CREATES_API_TOKEN"
            echo "is empty in this repository's context. It is an organisation secret, so"
            echo "either the name differs (check the exact spelling — CREATES) or it is"
            echo "not granted to this repository; grant it under the organisation's"
            echo "Actions secrets, then re-run this job. Failing red rather than"
            echo "skipping: the crate is in the tagged bytes, and a release that does"
            echo "not reach crates.io is the lane shipping nothing under a green light."
            exit 1
          fi
          cargo publish --locked
