    # to another job would bury its failure behind a package that already shipped.
    #
    # The gate expression is the npm job's, verbatim — see the comment there;
    # a divergence between the publish jobs is a release that ships to one
    # destination and not another. Like the MCP and TS SDK jobs it carries no
    # token guard: it publishes with the same secret the engine's job just
    # used in this same run.
    #
    # The rules package versions with the engine by decision: the catalog
    # is the input surface for the `rules` CLI commands, and those commands
