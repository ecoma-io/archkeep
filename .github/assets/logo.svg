<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lattice">
  <title>Lattice</title>
  <!-- The mark is the architecture. A lattice's bars both CONNECT and BLOCK,
       which is the two halves of this tool: the edges it makes visible, and the
       ones it refuses.

       Colours are Ecoma design tokens, not choices made here:
         --primary 211 37% 32% → #335170, the structure that holds
         --agent   18 56% 39% → #9B4D2C, the crossing that is refused
       Same pair Litmus declares in its own logo. Changing one is a brand
       decision, not a styling one. -->
  <g fill="none" stroke="#335170" stroke-width="3.2" stroke-linecap="round">
    <!-- warp: three vertical bars -->
    <path d="M16 8 V56" />
    <path d="M32 8 V56" />
    <path d="M48 8 V56" />
    <!-- weft: three horizontal bars. The middle one stops short of the right
         crossing — that gap is where the refused edge goes. -->
    <path d="M8 16 H56" />
    <path d="M8 32 H41" />
    <path d="M8 48 H56" />
  </g>
  <!-- the one crossing that does not connect: an edge the boundary refuses -->
  <g stroke="#9B4D2C" stroke-width="3.2" stroke-linecap="round">
    <path d="M44.2 28.2 L51.8 35.8" />
    <path d="M51.8 28.2 L44.2 35.8" />
  </g>
</svg>
