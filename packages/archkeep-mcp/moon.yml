# Archkeep MCP — the agent capability interface over the engine's commands.
#
# Tags use dash separators (type-package, scope-nx) because Moon tags cannot
# contain colons, the same reason every sibling project does
# (`../../module-boundaries.config.mjs` argues it once, for the whole tree).
# `type-package` because this is a published npm unit a consumer installs and
# runs; `scope-nx` because it is engine toolchain — a sibling face of the CLI
# and language server, composing the same analysis rather than holding any of
# its own. The engine is reached through the `@ecoma-io/archkeep` dependency's
# `./commands` subpath, in-process; nothing here spawns the CLI or parses its
# text output, which is what keeps one analysis behind every face.
id: archkeep-mcp
language: javascript
layer: library
stack: backend
tags:
  - type-package
  - scope-nx
tasks:
  lint:
    command: eslint . --max-warnings 0
    inputs:
      - "**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/eslint.config.mjs"
  test:
    command: vitest run
    inputs:
      - "**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/packages/archkeep/**"
  typecheck:
    command: tsc -p tsconfig.json
    inputs:
      - "**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/tsconfig.base.json"
      - "/packages/archkeep/**"

# Verification dependencies, not npm ones — Moon needs these to decide what a
# change invalidates, which package.json alone cannot tell it:
#
# - `archkeep` (scope production) — the one npm dependency: `src/` composes the
#   engine's `./commands` subpath in-process, so an engine change must re-run
#   this package's suite, and only this package's. `vscode` carries no such
#   edge on purpose: it talks to the engine over LSP with the engine installed
#   in a consumer's workspace, and its own suite drives none of it.
# - The bootstrap pair (root `package.json` + `pnpm-lock.yaml`) is declared on
#   every task here — each runs a tool the pnpm install provides, so a lockfile
#   bump can move any of them.
#
# Task `inputs`: the default when none are declared is the whole project
# (`**/*`) plus `.moon/**`, and root-level files are NOT included — declared
# here per task, and the bare `**/*` first entry is what keeps the project's
# own files hashed (explicit inputs REPLACE the default rather than extend
# it — measured with `moon query tasks --affected`). `eslint.config.mjs` can
# move every lint verdict, `tsconfig.base.json` every typecheck verdict, and
# the whole engine tree rides on `test` and `typecheck` — the suite imports
# the engine in-process through the workspace symlink and `tsc` resolves its
# types, so a warm cache must never replay either over engine bytes that have
# since changed. A rules-catalog change must not re-run `lint` here.
dependsOn:
  - id: archkeep
    scope: production
