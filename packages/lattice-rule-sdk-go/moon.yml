# The Go rule-authoring SDK — the second SDK in this tree, and the first
# package here whose version is not written anywhere in it.
#
# Tags use dash separators (type-package, scope-sdk) because Moon tags cannot
# contain colons, the same reason every project beside it does
# (`../../module-boundaries.config.mjs` argues it once, for the whole tree).
# `scope-sdk` is the scope `../lattice-rule-sdk-rust/moon.yml` introduced, and
# this package joins it rather than adding a second: what that row keeps apart
# is the SDKs and the engine, not one SDK from another.
id: lattice-rule-sdk-go
language: go
layer: library
stack: backend
tags:
  - type-package
  - scope-sdk
tasks:
  # `script` rather than `command`, because this task is two commands and a Moon
  # `command` is one — the same shape the Rust package's lint task has, and for
  # the same reason: gofmt decides layout, go vet decides everything else, and
  # splitting them into two tasks would leave `lint` naming only one of them.
  #
  # The `if` is not decoration. `gofmt -l` PRINTS the files it would reformat
  # and exits 0 either way, so `script: gofmt -l . && go vet ./...` would report
  # a green lint over a package whose every file was misformatted — an exit code
  # that means nothing, which is the silent direction this repository is built
  # against (`../../AGENTS.md`). Emptiness of its output is the only signal it
  # gives, so emptiness is what this reads.
  #
  # Both halves see `./abi_freestanding.go` only in part: gofmt is blind to build
  # constraints and formats it, `go vet` is not and skips it, because the
  # standard toolchain cannot compile that file at all (`./README.md` measures
  # why). What covers it instead is `./rebuild-example.sh`, which builds it with
  # the toolchain that can and then instantiates the result.
  lint:
    script: |
      if [ -n "$(gofmt -l .)" ]; then
        echo "gofmt would reformat these files; run gofmt -w ."
        gofmt -l .
        exit 1
      fi
      go vet ./...
  # Runs the unit tests, the golden fixture suite, and the artifact checks —
  # deliberately NOT a wasm rebuild. The artifact is committed and pinned by its
  # digest, so what the suite proves is the bytes in the tree rather than bytes
  # the runner just made (`./rebuild-example.sh` says the rest, and needs a
  # second toolchain no CI leg here installs).
  #
  # `script` rather than `command`, because a bare `go test ./...` exits 0 over
  # a tree that ran nothing. Measured against go1.26.4, both shapes: a package
  # with no `_test.go` prints `?  pkg [no test files]`, and a package whose test
  # file declares no `Test…` function prints `ok pkg [no tests to run]`. Both
  # are exit 0, which makes a target that ran nothing byte-for-byte identical to
  # one that ran everything — the silent direction (`../../AGENTS.md`), and the
  # same one `../../.github/workflows/ci.yml` already refuses for the Vitest
  # lane. `-v` is what makes the count visible: it prints one `=== RUN` line per
  # test, cached replays included, and neither zero-test shape above prints a
  # single one. The output is captured rather than streamed so it can be both
  # printed and counted; `|| status=$?` keeps a failing run's output on screen
  # instead of aborting before the `printf`.
  test:
    script: |
      status=0
      output="$(go test -v ./... 2>&1)" || status=$?
      printf '%s\n' "$output"
      [ "$status" -eq 0 ] || exit "$status"
      if ! printf '%s\n' "$output" | grep -q '^=== RUN'; then
        echo "go test ./... executed no tests — a green target here would mean nothing ran"
        exit 1
      fi
  # The Go half of what `tsc --noEmit` is for the .mjs packages. `go build` over
  # more than one package compiles and discards, writing no binary — measured,
  # because a typecheck target that dropped an executable into the package root
  # would be an untracked file in every contributor's tree.
  typecheck:
    command: go build ./...
